name: tofu-plan

# No pull_request trigger on purpose: the Cloudflare token lives in the
# `cloudflare` environment, and a plan that read it on PRs would hand it to
# fork PRs. PRs get fmt/validate from ci.yml instead. See docs/negative-tests.md.
#
# Since SDLC #622 the state lives in R2, so a plan needs the state backend's key
# pair as well. This job is a read-only drift check on main (and on demand): the
# apply path is workflow_dispatch in tofu-apply.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: tofu
  cancel-in-progress: false

jobs:
  plan:
    name: plan (cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
        # Absent credentials mean the environment has not been provisioned yet:
        # report it and succeed rather than fail every push to main.
        run: |
          if [[ -z ${CLOUDFLARE_API_TOKEN:-} ]]; then
            echo "::notice::CLOUDFLARE_API_TOKEN absent; skipping plan"
            exit 0
          fi
          if [[ -z ${AWS_ACCESS_KEY_ID:-} || -z ${AWS_SECRET_ACCESS_KEY:-} ]]; then
            echo "::notice::R2 state credentials absent; skipping plan (state backend unreachable)"
            exit 0
          fi
          export AWS_DEFAULT_REGION=auto
          tofu -chdir=tofu init -input=false -no-color
          # -lock=false: a plan must never block an operator's apply, and a plan
          # cannot change the state.
          tofu -chdir=tofu plan -input=false -lock=false -no-color
