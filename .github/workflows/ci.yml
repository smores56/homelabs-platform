name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kustomize:
    name: kustomize build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: build every clusters/** kustomization
        run: scripts/kustomize-build-all.sh

  broker:
    name: broker unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # No third-party dependency: the runner's python3 runs the stdlib broker.
      # The address policy, DNS pinning, redirect refusal, credential stripping,
      # header/body redaction and the log shape are all asserted here, and the
      # enrollment file is parsed by the same tests that the Deployment ships.
      - name: run apps/broker unit tests
        run: python3 -m unittest discover -s apps/broker/tests -t apps/broker -v

  agent-control:
    name: agent-control unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # Stdlib only, like the broker. The route allowlist, the log filter, the
      # Secrets/ConfigMaps guard, the tail clamp and the audit line are asserted
      # here; tests/policies/check.sh asserts the RBAC and network ceiling.
      - name: run agent-control unit tests
        run: tests/agent-control/check.sh

  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: render manifests
        run: scripts/kustomize-build-all.sh "$RUNNER_TEMP/manifests"
      - name: validate against Kubernetes schemas
        # fixtures/ are the admission-policy test manifests; validating them
        # here keeps every object we claim to admit or deny schema-clean.
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.34.0 "$RUNNER_TEMP"/manifests/*.yaml \
            tests/policies/fixtures/*.yaml

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: lint every tracked YAML file
        run: |
          yamllint --version
          yamllint -c .yamllint.yaml $(git ls-files '*.yaml' '*.yml')

  tofu:
    name: tofu fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: fmt
        run: tofu fmt -check -recursive tofu
      - name: validate
        # No backend and no secrets: validate only needs provider schemas.
        run: |
          tofu -chdir=tofu init -backend=false -input=false
          tofu -chdir=tofu validate
      - name: static Access and DNS assertions
        # Default-deny shape, the public bypass list, CAA pins, the retired
        # hostnames and the tunnel split. No token, no API call.
        run: tests/tofu/check.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: lint scripts
        run: |
          shellcheck --version
          shellcheck scripts/*.sh tests/policies/*.sh tests/tofu/*.sh \
            tests/access/*.sh tests/backup/*.sh tests/digest/*.sh \
            tests/observability/*.sh tests/agent-control/*.sh \
            clusters/homelab/flux-system/bootstrap.sh \
            clusters/homelab/platform/backup/*.sh

  action-pins:
    name: action SHA pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: every action is pinned to a full SHA
        run: scripts/check-action-pins.sh

  codeowners:
    name: CODEOWNERS coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: CODEOWNERS covers every Kanbei-critical path
        run: scripts/check-codeowners.sh

  fork-pr-secret-boundary:
    name: fork-pr-secret-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: fork PRs receive no secrets
        run: |
          echo "This job is triggered by pull_request from fork and branch PRs."
          echo "It holds no environment and no repository secret; a fork PR run"
          echo "reaches only a read-only GITHUB_TOKEN. docs/negative-tests.md"
          echo "records the runtime half as a manual step."
          test -z "${CLOUDFLARE_API_TOKEN:-}"
      - name: no pull_request workflow references a secret
        run: scripts/check-pr-secret-boundary.sh

  observability:
    name: observability pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Vector unit tests for the data-tenant allowlist (the planted Immich line
      # must lose its filename and album name), a full `vector validate`, the
      # prod-vs-test drift comparisons, and the status-exporter and Loki-gateway
      # unit tests. kustomize build and kubeconform cover the manifests in their
      # own jobs.
      - name: vector tests, config lint, exporter unit tests
        run: tests/observability/check.sh

  digest:
    name: cluster digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Fixture-driven builder tests (planted prompt/body must not survive, key
      # ordering, 64 KiB bound, retention) plus the rendered contract: schedule,
      # the single ESO token, the static PV/PVC pair, the two-source egress
      # allowlist, no ingress into the job, and no Service or reverse path.
      - name: digest builder and manifest checks
        run: tests/digest/check.sh

  policy-checks:
    name: policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Static half: no cluster, no credentials.
      - name: static policy, RBAC and network checks
        run: tests/policies/check.sh
      - name: repository-mirror script shape tests
        run: tests/backup/check.sh

  policy-admission:
    name: policy admission runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # A real apiserver is the only thing that evaluates CEL: a static grep can
      # pass on a policy whose expression is vacuous. This job boots etcd plus
      # kube-apiserver (tests/policies/apiserver.sh) and drives every fixture and
      # RBAC row through real admission and authorisation decisions.
      - name: Install Nix
        uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: admission and authorisation against a throwaway control plane
        run: |
          nix shell nixpkgs#etcd nixpkgs#kubernetes nixpkgs#kubectl nixpkgs#kustomize \
            nixpkgs#yq-go nixpkgs#jq nixpkgs#openssl -c \
            tests/policies/check.sh --runtime
      # check.sh stops the control plane on exit; this runs even when it is
      # killed mid-run (cancel, timeout) so no etcd/apiserver survives the job.
      # The logs are printed here because a runner's TMPDIR is discarded, and a
      # failed control-plane start is otherwise undiagnosable from the job.
      - name: stop the throwaway control plane
        if: always()
        run: |
          state="${TMPDIR:-/tmp}/homelabs-policy-apiserver"
          for log in "$state"/etcd.log "$state"/apiserver.log; do
            if [ -f "$log" ]; then
              echo "--- $log"
              tail -40 "$log"
            fi
          done
          tests/policies/apiserver.sh stop || true
