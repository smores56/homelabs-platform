name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kustomize:
    name: kustomize build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: build every clusters/** kustomization
        run: scripts/kustomize-build-all.sh

  broker:
    name: broker unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # No third-party dependency: the runner's python3 runs the stdlib broker.
      # The address policy, DNS pinning, redirect refusal, credential stripping,
      # header/body redaction and the log shape are all asserted here, and the
      # enrollment file is parsed by the same tests that the Deployment ships.
      - name: run apps/broker unit tests
        run: python3 -m unittest discover -s apps/broker/tests -t apps/broker -v

  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: render manifests
        run: scripts/kustomize-build-all.sh "$RUNNER_TEMP/manifests"
      - name: validate against Kubernetes schemas
        # fixtures/ are the admission-policy test manifests; validating them
        # here keeps every object we claim to admit or deny schema-clean.
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.34.0 "$RUNNER_TEMP"/manifests/*.yaml \
            tests/policies/fixtures/*.yaml

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: lint every tracked YAML file
        run: |
          yamllint --version
          yamllint -c .yamllint.yaml $(git ls-files '*.yaml' '*.yml')

  tofu:
    name: tofu fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: fmt
        run: tofu fmt -check -recursive tofu
      - name: validate
        # No backend and no secrets: validate only needs provider schemas.
        run: |
          tofu -chdir=tofu init -backend=false -input=false
          tofu -chdir=tofu validate
      - name: static Access and DNS assertions
        # Default-deny shape, the public bypass list, CAA pins, the retired
        # hostnames and the tunnel split. No token, no API call.
        run: tests/tofu/check.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: lint scripts
        run: |
          shellcheck --version
          shellcheck scripts/*.sh tests/policies/*.sh tests/tofu/*.sh \
            tests/access/*.sh clusters/homelab/flux-system/bootstrap.sh

  action-pins:
    name: action SHA pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: every action is pinned to a full SHA
        run: scripts/check-action-pins.sh

  codeowners:
    name: CODEOWNERS coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: CODEOWNERS covers every Kanbei-critical path
        run: scripts/check-codeowners.sh

  fork-pr-secret-boundary:
    name: fork-pr-secret-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: fork PRs receive no secrets
        run: |
          echo "This job is triggered by pull_request from fork and branch PRs."
          echo "It holds no environment and no repository secret; a fork PR run"
          echo "reaches only a read-only GITHUB_TOKEN. docs/negative-tests.md"
          echo "records the runtime half as a manual step."
          test -z "${CLOUDFLARE_API_TOKEN:-}"
      - name: no pull_request workflow references a secret
        run: scripts/check-pr-secret-boundary.sh

  observability:
    name: observability pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Vector unit tests for the data-tenant allowlist (the planted Immich line
      # must lose its filename and album name), a full `vector validate`, the
      # prod-vs-test drift comparisons, and the status-exporter and Loki-gateway
      # unit tests. kustomize build and kubeconform cover the manifests in their
      # own jobs.
      - name: vector tests, config lint, exporter unit tests
        run: tests/observability/check.sh

  policy-checks:
    name: policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      # Static half only: no cluster, no credentials. The runtime half boots a
      # throwaway kube-apiserver and is run by hand (docs/negative-tests.md).
      - name: static policy, RBAC and network checks
        run: tests/policies/check.sh
