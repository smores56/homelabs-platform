name: tofu-apply

# Merge is the approval (SDLC #622). A merge to main plans and applies the
# Cloudflare zone; the pre-merge plan is `tofu-plan-pr.yml`, which is the
# required check on every PR. There is no approver on the environment: the
# reviewer rule that used to sit there was the thing being clicked, and it
# moved into the merge.
#
# What still guards the write token, since the environment no longer asks:
#
#   * `cloudflare`'s deployment-branch policy allows `main` only, so no branch
#     workflow can reach this token;
#   * the job refuses to run for any actor other than the repository owner —
#     loud, not silent, because a skipped apply is drift;
#   * a plan that destroys or replaces anything is NOT applied: it fails the
#     run and names the dispatch that applies it deliberately. Additive plans
#     (the common case) apply unattended. Note the limit: an added Access
#     bypass or DNS record is additive and is not caught here, which is why the
#     pre-merge plan is the required check.
#   * an auto-approve flag is never used; the saved plan from this same run is what
#     applies.
on:
  push:
    branches: [main]
    paths:
      - "tofu/**"
      - ".github/workflows/tofu-apply.yml"
  workflow_dispatch:
    inputs:
      plan_only:
        description: "Plan only; do not apply. Use for an additive change you do not want landed yet."
        type: boolean
        default: false

permissions: read-all

# One writer at a time; a queued apply must not interleave with another.
concurrency:
  group: tofu
  cancel-in-progress: false

jobs:
  apply:
    name: plan and apply (cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: refuse runs that are not the owner
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ $ACTOR != "$OWNER" ]]; then
            echo "::error::refusing to plan or apply: the actor is '$ACTOR', not '$OWNER'."
            echo "::error::homelabs-platform is human-only; a bot merge or dispatch may not write the zone."
            exit 1
          fi

      - name: install pinned tools
        run: |
          scripts/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: init (R2 state backend)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z ${!name:-} ]]; then
              echo "::error::$name absent; the zone or the state backend is unreachable"
              exit 1
            fi
          done
          export AWS_DEFAULT_REGION=auto
          tofu -chdir=tofu init -input=false -no-color

      - name: plan (-detailed-exitcode)
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
        # 0 = no changes, 1 = error, 2 = changes. Only 0 and 2 may continue.
        run: |
          set -o pipefail
          export AWS_DEFAULT_REGION=auto
          # pipefail matters: without it `tee` would mask a failed plan as exit 0
          # (no changes) and the apply step would be skipped instead of stopped.
          # -parallelism=3: the zone is ~15 resources and Cloudflare answers 429
          # (code 10429) long before the default of 10 is useful.
          # status=0: `|| status=$?` only assigns on failure, so without this the
          # case below sees an empty string and reports a successful plan as an
          # error ("tofu plan failed (exit )").
          status=0
          tofu -chdir=tofu plan -input=false -lock=false -no-color \
            -detailed-exitcode -out=tfplan -parallelism=3 | tee plan.txt || status=$?
          {
            echo '## plan'
            echo
            echo '```'
            tail -n 200 plan.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) echo "changes=false" >>"$GITHUB_OUTPUT"
               echo "::notice::plan is empty" ;;
            2) echo "changes=true" >>"$GITHUB_OUTPUT"
               echo "::notice::plan has changes" ;;
            *) echo "::error::tofu plan failed (exit $status)"
               exit 1 ;;
          esac

      - name: stop on a destructive plan
        if: steps.plan.outputs.changes == 'true'
        run: |
          set -euo pipefail
          # Replacements and destroys are the plans where the diff does not tell
          # the whole story. They do not apply from a merge; the owner dispatches
          # after reading the summary above.
          if grep -qE 'must be replaced|will be destroyed|(^|[[:space:]])[-+]/\+' plan.txt; then
            echo "::error::the plan replaces or destroys resources. Nothing was applied."
            echo "::error::read the plan above, then dispatch this workflow from the owner account to apply it."
            exit 1
          fi
          echo "::notice::plan is additive only"

      - name: apply (saved plan from this run)
        if: steps.plan.outputs.changes == 'true' && (github.event_name != 'workflow_dispatch' || inputs.plan_only != true)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
        # The plan file was produced seconds ago by the step above, against the
        # same state, so what ran above is what applies. Never auto-approve.
        run: |
          export AWS_DEFAULT_REGION=auto
          tofu -chdir=tofu apply -input=false -no-color tfplan

      - name: explain a skipped apply
        if: steps.plan.outputs.changes == 'true' && github.event_name == 'workflow_dispatch' && inputs.plan_only == true
        run: echo "::notice::plan_only was set; nothing was applied"
