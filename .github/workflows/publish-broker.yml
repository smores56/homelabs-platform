# GitHub Packages accepts only a classic PAT or this workflow's GITHUB_TOKEN —
# never a GitHub App installation token. So the package credential is
# `packages: write` on the job token; the agent uses its app identity only to
# trigger or read the run (Actions: read/write), and never holds a package
# credential. Publishing links the package to this repository, which is what
# lets the cluster pull it by digest.
name: publish-broker

on:
  push:
    branches: [main]
    paths:
      - "apps/broker/**"
      - ".github/workflows/publish-broker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-broker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build, push, and print the digest
        env:
          IMAGE: ghcr.io/smores56/homelabs-platform/broker
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::12}"
          printf '%s' "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE:$tag" apps/broker
          docker push "$IMAGE:$tag"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$tag" | cut -d@ -f2)
          {
            echo "### Broker image"
            echo
            echo "- \`$IMAGE:$tag\`"
            echo "- \`$IMAGE@$digest\`"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "pin: $IMAGE@$digest"
