# expect: deny tenant-images
apiVersion: v1
kind: Pod
metadata:
  name: nanobot-scratch
  namespace: tenant-apps
  labels:
    app.kubernetes.io/name: nanobot
    app.kubernetes.io/part-of: homelabs
spec:
  serviceAccountName: nanobot
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nanobot
      image: ghcr.io/smores56/homelabs-platform/nanobot:v1.2.3
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      env:
        - name: NANOBOT_CONFIG_DIR
          value: /etc/nanobot
      volumeMounts:
        - name: nanobot-policy
          mountPath: /etc/nanobot/prompts/system.md
          subPath: system.md
          readOnly: true
        - name: nanobot-policy
          mountPath: /etc/nanobot/models/providers.yaml
          subPath: providers.yaml
          readOnly: true
        - name: scratch
          mountPath: /scratch
  volumes:
    - name: nanobot-policy
      configMap:
        name: nanobot-policy
    - name: scratch
      persistentVolumeClaim:
        claimName: nanobot-scratch
