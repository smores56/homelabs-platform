---
extends: default

ignore: |
  manifests/
  .terraform/
  # SOPS ciphertext: base64 blobs and a sops metadata block, neither hand-edited.
  secrets/
  # Generated by `flux install --export --components-extra=source-watcher,image-reflector-controller,image-automation-controller`.
  # Must stay byte-identical to upstream output, so it is not hand-wrapped.
  clusters/homelab/flux-system/gotk-components.yaml

rules:
  line-length:
    max: 160
  truthy:
    allowed-values: ["true", "false", "on"]
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  document-start: disable
  braces:
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
