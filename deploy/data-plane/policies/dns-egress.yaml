# The one exception every pod gets: cluster DNS. It selects the CoreDNS pods by
# their standard `k8s-app: kube-dns` label inside kube-system, so no other pod in
# that namespace (metrics, dashboards, any future workload) becomes a resolver
# target. Label and port, not a CIDR.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: data-plane
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
