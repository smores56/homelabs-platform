# The recovery page is the one service a human opens. Ingress is the existing
# cluster tunnel only (`ingress/cloudflared`); no agent namespace reaches it.
#
# The portal has no egress at all: not DNS, not 443, not any public range. It
# reads generation manifests from its claim and serves them; a download is the
# browser following a pre-signed R2 URL directly, not a fetch the pod makes. The
# R2 credential and the signed URL never enter this namespace. If a server-side
# fetch is ever required, name the exact R2/Cloudflare endpoint as an ipBlock;
# a general 0.0.0.0/0 rule must never come back.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-recovery-portal
  namespace: data-plane
  labels:
    app.kubernetes.io/name: recovery-portal
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: recovery-portal
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - protocol: TCP
          port: 8080
