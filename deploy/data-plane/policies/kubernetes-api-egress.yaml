# The API server is not a pod (kube-apiserver runs on the host in k3s), so a
# podSelector cannot express it. A client dials the `kubernetes` ClusterIP; the
# service range's first address is the API endpoint at 10.43.0.1, and kube-router
# matches the destination an egress rule names. Only that single endpoint on 443
# and 6443 is allowed: the rest of the service CIDR (every ClusterIP) is not.
#
# A different cluster needs its own API endpoint address; widen here only after
# checking the CNI's DNAT order.
#
# Only backup-controller is selected. No other pod in this tree has a token, so
# giving any other pod API egress would be a capability with no user.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubernetes-api-egress
  namespace: data-plane
  labels:
    app.kubernetes.io/name: backup-controller
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backup-controller
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
