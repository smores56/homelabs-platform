# Human-facing recovery page. It reads generation manifests from the shared
# claim and the recovery-group inventory from a ConfigMap, both mounted
# read-only. It never holds a Restic password, an R2 key or a Kubernetes token;
# browsing is a read over manifests, and a download is streamed from a
# short-lived URL minted elsewhere.
#
# The shared claim is `ReadWriteOnce`. The portal and the backup controller must
# therefore be co-located on the node that owns the volume; on the single-node
# k3s cluster this is automatic. A multi-node deployment needs a read-only
# mirrored copy, not a second writer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recovery-portal
  namespace: data-plane
  labels:
    app.kubernetes.io/name: recovery-portal
    app.kubernetes.io/component: recovery
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: recovery-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recovery-portal
        app.kubernetes.io/component: recovery
        app.kubernetes.io/part-of: homelabs
        homelabs.dev/tier: platform
        homelabs.dev/managed-by: platform
    spec:
      serviceAccountName: recovery-portal
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recovery-portal
          # Placeholder: pinned by digest in base/kustomization.yaml.
          image: data-plane
          args: ["portal"]
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATA_PLANE_HOST
              value: 0.0.0.0
            - name: DATA_PLANE_PORT
              value: "8080"
            - name: DATA_PLANE_MANIFEST_DIR
              value: /srv/manifests
            - name: DATA_PLANE_RECOVERY_GROUPS
              value: /etc/data-plane/recovery-groups.json
            - name: PORTAL_READ_ONLY
              value: "true"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: manifests
              mountPath: /srv/manifests
              readOnly: true
            - name: config
              mountPath: /etc/data-plane
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: manifests
          persistentVolumeClaim:
            claimName: backup-manifests
            readOnly: true
        - name: config
          configMap:
            name: data-plane-config
            defaultMode: 288
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      terminationGracePeriodSeconds: 15
