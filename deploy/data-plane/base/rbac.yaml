# The only RBAC object in the data plane. Snapshot and restore authority for
# ZFS stays on the host (the controller writes a request file; a host unit owns
# the pool). The controller itself only needs to see its own namespace's claims
# and pods, and it reads no pod output.
#
# Restore execution is an operator/host action, not a controller capability: the
# controller can neither create nor delete Jobs, and it cannot read container
# logs. If a restore Job is ever required, it is a pre-created template with
# immutable labels and a dedicated ServiceAccount that the operator applies; the
# controller never mints one dynamically.
#
# Deliberately absent: every cluster-scoped resource, secrets, configmaps,
# Jobs, pods/log, pods/exec, pods/attach, port-forward, and writes to Services,
# Deployments or NetworkPolicies. There is no ClusterRole, so a compromised
# controller cannot read another namespace, a PV, a StorageClass or a
# VolumeAttachment.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-controller
  namespace: data-plane
  labels:
    app.kubernetes.io/name: backup-controller
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-controller
  namespace: data-plane
  labels:
    app.kubernetes.io/name: backup-controller
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-controller
subjects:
  - kind: ServiceAccount
    name: backup-controller
    namespace: data-plane
