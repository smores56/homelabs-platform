# One identity per service, none of them able to mint a token by default. Only
# backup-controller receives a token, and it is a short-lived projected token
# declared by that pod, not an automounted one.
#
# The other accounts exist to keep every pod off the `default` account and to
# make "no binding" a reviewable fact: event-service, write-broker,
# confirmation-surface, collector-relay and recovery-portal have no Role and no
# RoleBinding anywhere in this tree.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-service
  namespace: data-plane
  labels:
    app.kubernetes.io/name: event-service
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: write-broker
  namespace: data-plane
  labels:
    app.kubernetes.io/name: write-broker
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: confirmation-surface
  namespace: data-plane
  labels:
    app.kubernetes.io/name: confirmation-surface
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-controller
  namespace: data-plane
  labels:
    app.kubernetes.io/name: backup-controller
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector-relay
  namespace: data-plane
  labels:
    app.kubernetes.io/name: collector-relay
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recovery-portal
  namespace: data-plane
  labels:
    app.kubernetes.io/name: recovery-portal
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
automountServiceAccountToken: false
