# Event-driven and scheduled snapshot fan-out. One replica and `Recreate`:
# the controller owns one generation at a time and must never race itself.
#
# It does not touch ZFS directly. A host unit owns the pool, the snapshot and
# the repositories; the controller writes a request file into its manifest claim
# and waits for the corresponding generation manifest. That keeps `hostPath`,
# privileged mode and the ZFS tools out of the data-plane namespace.
#
# It is the only pod in this tree with an API token, and even that is a
# short-lived projected token (one hour) mounted at the standard in-cluster path.
# `automountServiceAccountToken` stays false on both the account and the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-controller
  namespace: data-plane
  labels:
    app.kubernetes.io/name: backup-controller
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-controller
        app.kubernetes.io/component: backup
        app.kubernetes.io/part-of: homelabs
        homelabs.dev/tier: platform
        homelabs.dev/managed-by: platform
    spec:
      serviceAccountName: backup-controller
      automountServiceAccountToken: false
      # The in-cluster config discovers the API from KUBERNETES_SERVICE_HOST/PORT,
      # which the kubelet injects as service links; token automount stays off.
      enableServiceLinks: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup-controller
          # Placeholder: pinned by digest in base/kustomization.yaml.
          image: data-plane
          args: ["backup"]
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATA_PLANE_HOST
              value: 0.0.0.0
            - name: DATA_PLANE_PORT
              value: "8080"
            - name: DATA_PLANE_MANIFEST_DIR
              value: /var/lib/data-plane/manifests
            - name: DATA_PLANE_GROUPS
              value: browsing,finance,mail,photos,books,notes,memory-local,memory-external,data-plane-state
            - name: DATA_PLANE_DESTINATIONS
              value: nvme,hdd,r2
            # The full inventory is mounted for the controller's classifier; the
            # comma list above is the service's runtime view of the same set.
            - name: DATA_PLANE_CATALOG
              value: /etc/data-plane/source-catalog.json
            - name: RECOVERY_GROUPS_FILE
              value: /etc/data-plane/recovery-groups.json
            - name: SNAPSHOT_REQUEST_DIR
              value: /var/lib/data-plane/manifests/requests
            - name: EVENT_SERVICE_URL
              value: http://event-service.data-plane.svc.cluster.local:8080
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/data-plane
              readOnly: true
            - name: manifests
              mountPath: /var/lib/data-plane/manifests
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: data-plane-config
            defaultMode: 288
        - name: manifests
          persistentVolumeClaim:
            claimName: backup-manifests
        # Same files the kubelet would automount, but with a one-hour bound
        # token instead of the default long-lived secret. The CA comes from the
        # namespace's standard `kube-root-ca.crt` ConfigMap.
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      terminationGracePeriodSeconds: 30
