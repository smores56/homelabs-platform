# Finance collector. Same shape as collector-brave: one pod, pod-local relay,
# schema ConfigMap, no Service, no token. The proxy is the only
# destination: the relay's sink is pod-local, so it has no internal peer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-finance
  namespace: data-plane
  labels:
    app.kubernetes.io/name: collector-finance
    app.kubernetes.io/component: collector-relay
    homelabs.dev/source: finance
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: collector-finance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector-finance
        app.kubernetes.io/component: collector-relay
        homelabs.dev/source: finance
        app.kubernetes.io/part-of: homelabs
        homelabs.dev/tier: platform
        homelabs.dev/managed-by: platform
    spec:
      serviceAccountName: collector-relay
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector-relay
          # Placeholder: pinned by digest in base/kustomization.yaml.
          image: data-plane
          args: ["collector"]
          imagePullPolicy: IfNotPresent
          ports:
            - name: relay
              containerPort: 8080
              protocol: TCP
          env:
            - name: SOURCE_ID
              value: finance
            - name: DATA_PLANE_SCHEMA
              value: /etc/data-plane-schema/schema.json
            # Contract only: the profile overlay mounts this source's own
            # relay HMAC secret. No shared relay secret and no event-service
            # token is mounted on the pod.
            - name: DATA_PLANE_SECRET_FILE
              value: /run/secrets/relay/finance/token
            - name: SOURCE_PROXY_URL
              value: http://finance-proxy.broker.svc.cluster.local:8443
            - name: DATA_PLANE_HOST
              value: 0.0.0.0
            - name: DATA_PLANE_PORT
              value: "8080"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: relay
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: relay
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: schema
              mountPath: /etc/data-plane-schema
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: schema
          configMap:
            name: collector-finance-schema
            defaultMode: 288
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
      terminationGracePeriodSeconds: 15
