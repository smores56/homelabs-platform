# Photo collector. The app's album/people metadata is application authority, so
# the collector preserves hashes and revisions and leaves derived embeddings to
# the indexer. Same isolation: no Service, no token, proxy-only external egress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-immich
  namespace: data-plane
  labels:
    app.kubernetes.io/name: collector-immich
    app.kubernetes.io/component: collector-relay
    homelabs.dev/source: immich
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: collector-immich
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector-immich
        app.kubernetes.io/component: collector-relay
        homelabs.dev/source: immich
        app.kubernetes.io/part-of: homelabs
        homelabs.dev/tier: platform
        homelabs.dev/managed-by: platform
    spec:
      serviceAccountName: collector-relay
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector-relay
          # Placeholder: pinned by digest in base/kustomization.yaml.
          image: data-plane
          args: ["collector"]
          imagePullPolicy: IfNotPresent
          ports:
            - name: relay
              containerPort: 8080
              protocol: TCP
          env:
            - name: SOURCE_ID
              value: immich
            - name: DATA_PLANE_SCHEMA
              value: /etc/data-plane-schema/schema.json
            # Contract only: the profile overlay mounts the relay HMAC secret.
            - name: DATA_PLANE_SECRET_FILE
              value: /run/secrets/relay/token
            - name: EVENT_SERVICE_URL
              value: http://event-service.data-plane.svc.cluster.local:8080
            - name: SOURCE_PROXY_URL
              value: http://immich-proxy.broker.svc.cluster.local:8443
            - name: DATA_PLANE_HOST
              value: 0.0.0.0
            - name: DATA_PLANE_PORT
              value: "8080"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: relay
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: relay
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: schema
              mountPath: /etc/data-plane-schema
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: schema
          configMap:
            name: collector-immich-schema
            defaultMode: 288
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
      terminationGracePeriodSeconds: 15
