# One collector VM per external source. The collector and the relay are the
# same process: the collector enumerates the source and submits signed,
# schema-validated records to the relay's pod-local listener, which is the only
# writer into the replica generation.
#
# No Service exists on purpose. The listener is bound to the pod, reachable only
# by the in-pod collector and the kubelet probes; NetworkPolicy denies all
# ingress from other pods and all egress except DNS and this source's proxy.
# No service-account token is mounted anywhere on the pod.
#
# Credentials are not a Secret in this tree. Per the design they arrive from the
# collector runtime's LUKS-backed host files; a profile overlay that changes that
# delivery mechanism adds the mount, never a plaintext value here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-brave
  namespace: data-plane
  labels:
    app.kubernetes.io/name: collector-brave
    app.kubernetes.io/component: collector-relay
    homelabs.dev/source: brave
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: collector-brave
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector-brave
        app.kubernetes.io/component: collector-relay
        homelabs.dev/source: brave
        app.kubernetes.io/part-of: homelabs
        homelabs.dev/tier: platform
        homelabs.dev/managed-by: platform
    spec:
      serviceAccountName: collector-relay
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector-relay
          # Placeholder: pinned by digest in base/kustomization.yaml.
          image: data-plane
          args: ["collector"]
          imagePullPolicy: IfNotPresent
          ports:
            - name: relay
              containerPort: 8080
              protocol: TCP
          env:
            - name: SOURCE_ID
              value: brave
            - name: DATA_PLANE_SCHEMA
              value: /etc/data-plane-schema/schema.json
            # Contract only: the profile overlay mounts this source's own
            # relay HMAC secret. No shared relay secret and no event-service
            # token is mounted on the pod.
            - name: DATA_PLANE_SECRET_FILE
              value: /run/secrets/relay/brave/token
            - name: SOURCE_PROXY_URL
              value: http://brave-proxy.broker.svc.cluster.local:8443
            - name: DATA_PLANE_HOST
              value: 0.0.0.0
            - name: DATA_PLANE_PORT
              value: "8080"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: relay
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: relay
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: schema
              mountPath: /etc/data-plane-schema
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: schema
          configMap:
            name: collector-brave-schema
            defaultMode: 288
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
      terminationGracePeriodSeconds: 15
