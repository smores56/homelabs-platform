---
- name: Reload sshd after a rescue change
  ansible.builtin.service:
    name: "{{ rescue_ssh_service }}"
    state: reloaded

- name: Reload systemd after rescue unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart the rescue tunnel
  ansible.builtin.systemd_service:
    name: "{{ rescue_cloudflared_unit }}"
    state: restarted
    daemon_reload: true

- name: Restart the rescue VPN path
  ansible.builtin.systemd_service:
    name: "{{ rescue_vpn_unit }}"
    state: restarted
    daemon_reload: true
