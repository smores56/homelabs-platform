---
recovery_state_dir: /var/lib/homelab/recovery
recovery_sentinel: "{{ recovery_state_dir }}/sentinel.json"
recovery_entrypoint: /usr/local/sbin/homelab-clean-room-restore
recovery_check_script: /usr/local/sbin/homelab-recovery-check
recovery_portal_unit: homelab-recovery-portal.service
# A restore target must be a scratch directory, not a live mount, and must not
# contain this marker (written by the data plane while its writers are active).
recovery_writer_marker_name: .homelab-writer-active
recovery_writer_fence: "{{ data_plane_run_root }}/writers-fenced"
# Every generation must have captured all of these destinations.
recovery_required_destinations:
  - primary
  - secondary
  - r2
recovery_manifest_schema_version: 1
recovery_backup_warn_hours: 24
