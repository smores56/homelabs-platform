---
- name: Pin the Kata and QEMU packages
  when: k3s_enable_kata_runtime | bool
  ansible.builtin.copy:
    dest: "{{ kata_preferences_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible/roles/kata.
      {% for package in kata_packages %}
      Package: {{ package }}
      Pin: version {{ kata_package_version }}
      Pin-Priority: 1001

      {% endfor %}

- name: Install the Kata runtime and QEMU
  when: k3s_enable_kata_runtime | bool
  ansible.builtin.apt:
    name: "{{ kata_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# The runtime class selects the runtime-rs shim, which then starts QEMU from its
# config. Checking `kata-runtime` would only prove the Go CLI exists; it is not
# on the containerd path at all.
- name: Check the Kata shim and QEMU binary
  when: k3s_enable_kata_runtime | bool
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ kata_runtime_binary }}"
    - "{{ kata_vmm_binary }}"
  register: kata_binaries

- name: Require the Kata shim and QEMU binary
  when: k3s_enable_kata_runtime | bool
  ansible.builtin.assert:
    that:
      - kata_binaries.results | rejectattr('stat.exists') | list | length == 0
      - kata_binaries.results | rejectattr('stat.executable') | list | length == 0
    fail_msg: >-
      {{ kata_runtime_binary }} or {{ kata_vmm_binary }} is missing; install the
      pinned kata-containers package and its QEMU dependency
    quiet: true

- name: Read the Kata configuration selected by the runtime class
  when: k3s_enable_kata_runtime | bool
  ansible.builtin.slurp:
    src: "{{ kata_config_file }}"
  register: kata_config

- name: Require the runtime class to select QEMU from that configuration
  when: k3s_enable_kata_runtime | bool
  ansible.builtin.assert:
    that:
      - (kata_config.content | b64decode)
        is search('path\s*=\s*"' ~ kata_vmm_binary ~ '"')
    fail_msg: >-
      {{ kata_config_file }} does not select {{ kata_vmm_binary }}; the
      {{ kata_runtime_class }} handler would start a different hypervisor
    quiet: true

- name: Publish the Kata RuntimeClass on the server
  ansible.builtin.copy:
    dest: "{{ kata_manifests_dir }}/runtimeclass-kata.yaml"
    owner: root
    group: root
    mode: "0644"
    content: |
      apiVersion: node.k8s.io/v1
      kind: RuntimeClass
      metadata:
        name: {{ kata_runtime_class }}
      handler: {{ kata_runtime_class }}
  when:
    - k3s_role == 'server'
    - k3s_enable_kata_runtime | bool
