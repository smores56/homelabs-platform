---
- name: Pin the Kata and QEMU packages
  when: k3s_enable_kata_runtime | bool
  ansible.builtin.copy:
    dest: "{{ kata_preferences_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible/roles/kata.
      {% for package in kata_packages %}
      Package: {{ package }}
      Pin: version {{ kata_package_version }}
      Pin-Priority: 1001

      {% endfor %}

- name: Install the Kata runtime and QEMU
  when: k3s_enable_kata_runtime | bool
  ansible.builtin.apt:
    name: "{{ kata_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check the Kata runtime binary
  when: k3s_enable_kata_runtime | bool
  ansible.builtin.stat:
    path: "{{ kata_runtime_binary }}"
  register: kata_runtime

- name: Require the Kata runtime binary
  when: k3s_enable_kata_runtime | bool
  ansible.builtin.assert:
    that:
      - kata_runtime.stat.exists
      - kata_runtime.stat.executable
    fail_msg: "{{ kata_runtime_binary }} is missing; install the pinned kata-containers package"

- name: Publish the Kata RuntimeClass on the server
  ansible.builtin.copy:
    dest: "{{ kata_manifests_dir }}/runtimeclass-kata.yaml"
    owner: root
    group: root
    mode: "0644"
    content: |
      apiVersion: node.k8s.io/v1
      kind: RuntimeClass
      metadata:
        name: {{ kata_runtime_class }}
      handler: {{ kata_runtime_class }}
  when:
    - k3s_role == 'server'
    - k3s_enable_kata_runtime | bool
