---
- name: Install the base package set
  ansible.builtin.apt:
    name: "{{ homelab_base_packages + homelab_extra_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the system timezone
  community.general.timezone:
    name: "{{ homelab_timezone }}"

- name: Apply kernel and network tunables
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-homelab.conf
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ homelab_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Create the administrative groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ ([homelab_admin_group] + (homelab_admin_users | selectattr('groups', 'defined') | map(attribute='groups') | flatten)) | unique }}"

- name: Create the administrative users
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | default([homelab_admin_group]) }}"
    append: true
    shell: "{{ item.shell | default('/bin/bash') }}"
    create_home: true
    state: present
  loop: "{{ homelab_admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install the operators' SSH public keys
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
    manage_dir: true
  loop: "{{ homelab_admin_users | selectattr('ssh_authorized_keys', 'defined') | subelements('ssh_authorized_keys') | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  when: homelab_admin_users | selectattr('ssh_authorized_keys', 'defined') | list | length > 0

- name: Ensure sshd includes the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include /etc/ssh/sshd_config\.d/\*\.conf$'
    line: 'Include /etc/ssh/sshd_config.d/*.conf'
    insertbefore: BOF
    state: present
    validate: /usr/sbin/sshd -t -f %s

- name: Harden the SSH daemon
  ansible.builtin.template:
    src: 99-hardening.conf.j2
    dest: "{{ homelab_ssh_dropin }}"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Limit the journal's disk footprint
  ansible.builtin.template:
    src: journald.conf.j2
    dest: "{{ homelab_journald_dropin }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald

- name: Install unattended security upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: "{{ homelab_unattended_auto_upgrades }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure unattended upgrade origins and blacklist
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: "{{ homelab_unattended_config }}"
    owner: root
    group: root
    mode: "0644"

- name: Enable the unattended upgrade service
  ansible.builtin.service:
    name: "{{ homelab_unattended_service }}"
    enabled: "{{ homelab_unattended_upgrades_enabled }}"
    state: "{{ 'started' if homelab_unattended_upgrades_enabled else 'stopped' }}"
