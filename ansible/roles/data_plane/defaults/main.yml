---
data_plane_default_container_user: "65532:65532"

# The five host services. Every image is selected by key from data_plane_images
# and must be digest-pinned. Units run rootful podman with a read-only container
# root, all capabilities dropped, and no-new-privileges; the host unit itself is
# hardened below and in templates/unit.service.j2.
data_plane_services:
  - name: homelab-event-service
    short: event-service
    description: Single-writer event log for the local profile
    image_key: event_service
    type: simple
    args: ["event"]
    ports:
      - "127.0.0.1:7101:7101"
    environment:
      DATA_PLANE_DB: "{{ data_plane_state_root }}/event-service/events.sqlite"
      DATA_PLANE_SECRET_FILE: "{{ data_plane_secret_root }}/event-service.env"
      DATA_PLANE_HOST: "0.0.0.0"
      DATA_PLANE_PORT: "7101"
    state_dir: "{{ data_plane_state_root }}/event-service"
    volumes:
      - "{{ data_plane_state_root }}/event-service:/var/lib/homelab/event-service:rw"
    read_write_paths:
      - "{{ data_plane_state_root }}/event-service"
      - "{{ data_plane_run_root }}/event-service"
    assert_mounts: []
    backup_mounts: false

  - name: homelab-write-broker
    short: write-broker
    description: Authoritative write broker for general sources
    image_key: write_broker
    type: simple
    # Writers are never started by a plain convergence run. site.yml starts this
    # unit only under `--tags writers` after the migration evidence gate.
    writer: true
    args: ["broker"]
    ports:
      - "127.0.0.1:7102:7102"
    environment:
      DATA_PLANE_DB: "{{ data_plane_state_root }}/write-broker/broker.sqlite"
      DATA_PLANE_SECRET_FILE: "{{ data_plane_secret_root }}/write-broker.env"
      DATA_PLANE_CATALOG: "{{ data_plane_config_root }}/sources.json"
      DATA_PLANE_HOST: "0.0.0.0"
      DATA_PLANE_PORT: "7102"
      DATA_PLANE_GENERAL_ROOT: /srv/books
    state_dir: "{{ data_plane_state_root }}/write-broker"
    volumes:
      - "{{ data_plane_state_root }}/write-broker:/var/lib/homelab/write-broker:rw"
      - "/srv/books:/srv/books:rw"
    read_write_paths:
      - "{{ data_plane_state_root }}/write-broker"
      - "{{ data_plane_run_root }}/write-broker"
      - /srv/books
    assert_mounts:
      - /srv/books
    backup_mounts: false

  - name: homelab-backup-controller
    short: backup-controller
    description: Fan-out Restic backup controller
    image_key: backup_controller
    type: oneshot
    args: ["backup"]
    ports: []
    environment:
      DATA_PLANE_MANIFEST_DIR: "{{ data_plane_state_root }}/backup-controller/manifests"
      DATA_PLANE_GROUPS: "{{ backup_groups | default([]) | join(',') }}"
      DATA_PLANE_DESTINATIONS: "{{ backup_destinations | default([]) | join(',') }}"
      DATA_PLANE_SECRET_FILE: "{{ data_plane_secret_root }}/backup-controller.env"
    state_dir: "{{ data_plane_state_root }}/backup-controller"
    container_user: "65532:65532"
    volumes:
      - "{{ data_plane_state_root }}/backup-controller:/var/lib/homelab/backup-controller:rw"
      - "/srv:/srv:ro"
      - "/var/backups/primary:/var/backups/primary:rw"
      - "/var/backups/secondary:/var/backups/secondary:rw"
    read_write_paths:
      - "{{ data_plane_state_root }}/backup-controller"
      - "{{ data_plane_run_root }}/backup-controller"
      - /var/backups/primary
      - /var/backups/secondary
    assert_mounts: "{{ zfs_datasets | map(attribute='mountpoint') | list }}"
    backup_mounts: true
    timer:
      calendar: hourly
      delay: 120

  - name: homelab-collector-relay
    short: collector-relay
    description: Scheduled reconciliation pass for collector replicas
    image_key: collector_relay
    type: simple
    args: ["relay"]
    ports:
      - "127.0.0.1:7104:7104"
    environment:
      DATA_PLANE_SECRET_FILE: "{{ data_plane_secret_root }}/collector-relay.env"
      DATA_PLANE_SCHEMA: "{{ data_plane_config_root }}/relay-schema.json"
      DATA_PLANE_HOST: "0.0.0.0"
      DATA_PLANE_PORT: "7104"
    state_dir: "{{ data_plane_state_root }}/collector-relay"
    volumes:
      - "{{ data_plane_state_root }}/collector-relay:/var/lib/homelab/collector-relay:rw"
    read_write_paths:
      - "{{ data_plane_state_root }}/collector-relay"
      - "{{ data_plane_run_root }}/collector-relay"
    assert_mounts: []
    backup_mounts: false

  - name: homelab-recovery-portal
    short: recovery-portal
    description: Read-only recovery portal over verified generations
    image_key: recovery_portal
    type: simple
    args: ["portal"]
    ports:
      - "127.0.0.1:7103:7103"
    environment:
      DATA_PLANE_PORTAL_DIR: "{{ data_plane_state_root }}/recovery-portal/site"
      DATA_PLANE_MANIFEST_DIR: "{{ data_plane_state_root }}/backup-controller/manifests"
      DATA_PLANE_HOST: "0.0.0.0"
      DATA_PLANE_PORT: "7103"
    state_dir: "{{ data_plane_state_root }}/recovery-portal"
    container_user: "65532:65532"
    volumes:
      - "{{ data_plane_state_root }}/recovery-portal:/var/lib/homelab/recovery-portal:rw"
      - "/var/backups/primary:/var/backups/primary:ro"
      - "/var/backups/secondary:/var/backups/secondary:ro"
    read_write_paths:
      - "{{ data_plane_state_root }}/recovery-portal"
      - "{{ data_plane_run_root }}/recovery-portal"
    assert_mounts: []
    backup_mounts: true
