---
# Operator-provided secret files only. Nothing here decrypts, prints, or
# templates a secret value: the operator decrypts the SOPS bundle outside the
# repository, points this role at that temporary directory, and wipes it after
# the run.
- name: Require an absolute operator secret source directory
  ansible.builtin.assert:
    that:
      - secrets_source_dir is string
      - secrets_source_dir | length > 0
      - secrets_source_dir is match('^/')
      - secrets_source_dir is not match('.*(^|/)\\.git(/|$).*')
    fail_msg: >-
      Set secrets_source_dir to an absolute path outside the repository that
      holds the decrypted operator files for this run.
    quiet: true

- name: Require a non-empty secret file list
  ansible.builtin.assert:
    that:
      - secrets_files is sequence
      - secrets_files | length > 0
    fail_msg: "secrets_files must list the files to install"
    quiet: true

- name: Create the secret directory
  ansible.builtin.file:
    path: "{{ secrets_dest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install each operator-provided secret file
  ansible.builtin.copy:
    src: "{{ secrets_source_dir }}/{{ item }}"
    dest: "{{ secrets_dest_dir }}/{{ item }}"
    owner: "{{ secrets_owner }}"
    group: "{{ secrets_group }}"
    mode: "{{ secrets_mode }}"
    force: true
  loop: "{{ secrets_files }}"
  loop_control:
    label: "{{ item }}"
  no_log: true
