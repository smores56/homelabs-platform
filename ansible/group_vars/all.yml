---
# Provisioning defaults for the Ubuntu host platform. Everything here is safe
# to commit: no secrets, no host-specific device paths, no mutable image tags.
# Storage hosts override the empty device variables in their inventory, and
# every playbook fails closed when a required value is still unset.

# --------------------------------------------------------------------------
# Base host
# --------------------------------------------------------------------------
homelab_timezone: Etc/UTC

homelab_admin_group: sudo
# Each entry: name, groups (optional), shell (optional), and either an inline
# ssh_authorized_keys list or an authorized_keys path to a public-key file on
# the controller (public keys only, never a private key):
# homelab_admin_users:
#   - name: smores
#     groups: [sudo]
#     shell: /bin/bash
#     ssh_authorized_keys:
#       - ssh-ed25519 AAAA... operator@laptop
#   - name: rescue
#     authorized_keys: /etc/homelab/rescue/smores.pub
# Every account must be in homelab_admin_group (sudo) and carry a usable key;
# the playbooks fail closed before writing an AllowGroups drop-in otherwise.
homelab_admin_users: []

homelab_base_packages:
  - ca-certificates
  - chrony
  - cryptsetup
  - curl
  - gnupg
  - htop
  - jq
  - lsof
  - lvm2
  - nvme-cli
  - podman
  - rsync
  - smartmontools
  - sudo
  - tmux
  - unattended-upgrades
  - zfsutils-linux
homelab_extra_packages: []

homelab_sysctl:
  fs.inotify.max_user_watches: 1048576
  kernel.dmesg_restrict: 1
  kernel.kptr_restrict: 2
  kernel.unprivileged_bpf_disabled: 1
  net.core.default_qdisc: fq
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.tcp_congestion_control: bbr
  vm.max_map_count: 1048576
  vm.swappiness: 10

homelab_journald:
  Compress: "yes"
  MaxFileSec: 1day
  RuntimeMaxUse: 256M
  SystemKeepFree: 4G
  SystemMaxUse: 1G

# The drop-in only ever names groups the admin accounts actually hold; base
# intersects this list with their real groups. A stale entry fails the run
# instead of silently locking sshd down to a group nobody is in.
homelab_ssh_port: 22
homelab_ssh_allow_groups:
  - sudo
homelab_ssh_max_auth_tries: 3
homelab_ssh_client_alive_interval: 300
homelab_ssh_client_alive_count_max: 2

homelab_unattended_upgrades_enabled: true
homelab_unattended_origins:
  - "${distro_id}:${distro_codename}-security"
  - "${distro_id}ESMApps:${distro_codename}-apps-security"
  - "${distro_id}ESM:${distro_codename}-infra-security"
homelab_unattended_package_blacklist: []

# --------------------------------------------------------------------------
# Destructive disk gate
# --------------------------------------------------------------------------
# There is no global boolean. A host may only touch the specific devices its
# own allow-list names, and only under `--tags destructive` with a reviewed
# migration evidence file. Each entry is a stable /dev/disk/by-id path, whose
# name already encodes the serial or WWN; LUKS volume entries additionally
# declare the expected serial/WWN and size.
homelab_destructive_device_ids: []

# Raw evidence file for `python3 -m data_plane.migration preflight`, on the
# controller. The Ansible gate re-runs the shared preflight over it and requires
# fresh verified backups on every required destination, a scratch restore, a
# boot-tested non-wiped 970, and two independent verified SSH paths. Pass it
# with -e homelab_migration_evidence=/abs/path/evidence.json.
homelab_migration_evidence: ""
homelab_migration_libs_dir: "{{ (playbook_dir | dirname | dirname) ~ '/libs' }}"

# The 970 rollback disk. Never a target while it is the rollback path; the
# evidence must mark it released before it can appear in the allow-list.
homelab_rollback_disk_device: ""

# Units the recovery playbook fences and only re-enables after a verified
# restore. The backup timer is fenced with them so no writer touches a target
# mid-restore.
homelab_writer_units:
  - homelab-write-broker.service
  - homelab-event-service.service
  - homelab-collector-relay.service
homelab_backup_timer: homelab-backup-controller.timer
homelab_writer_fence: "{{ data_plane_run_root }}/writers-fenced"

# Recovery playbook knobs. Restores always go to a scratch directory; the live
# target is only reachable behind an explicit allow-live override, and writers
# are re-enabled only after the scratch restore verifies.
homelab_recovery_allow_live: false
homelab_recovery_resume_writers: true
homelab_recovery_scratch_target: /mnt/recovery-scratch
homelab_recovery_required_destinations:
  - primary
  - secondary
  - r2

# --------------------------------------------------------------------------
# Rescue access
# --------------------------------------------------------------------------
# playbooks/rescue.yml refuses to pass until at least two independent SSH
# paths are listed here and each authenticates from the controller. Public
# addresses only; no secret ever belongs in this file. Example:
# rescue_verify_paths:
#   - name: lan
#     host: 192.0.2.10
#     port: 22
#     user: migration-breakglass
#   - name: tunnel
#     host: ssh-rescue.sammohr.dev
#     port: 22
#     user: migration-breakglass
rescue_verify_paths: []
rescue_verify_timeout: 10

# --------------------------------------------------------------------------
# LUKS2 volumes
# --------------------------------------------------------------------------
# Empty by default: the luks role refuses to run on a storage host until the
# operator supplies the real by-id paths. Ansible never creates, reads, or
# prints a passphrase. Each container carries the keyfile slot (root-only) plus
# an offline passphrase slot that the operator adds once from Bitwarden. The
# `noauto` crypttab option is derived from `auto: false`.
#
# Destructive runs additionally require, per entry: serial or wwn, size_bytes,
# and membership of `device` in homelab_destructive_device_ids. Optional keys:
#   allow_existing: true   accept a device that already carries a filesystem
#   manage_crypttab: false never write this volume into the managed block
# Before any inner filesystem or pool is created, the container must carry at
# least two keyslots and a root-only header backup at <luks_keyfile_dir>/<name>.header.
luks_volumes: []
luks_keyfile_dir: /etc/luks

# --------------------------------------------------------------------------
# ZFS and the recovery-group inventory
# --------------------------------------------------------------------------
zfs_pool: tank
zfs_pool_luks_volume: luks-data
zfs_pool_device: "/dev/mapper/{{ zfs_pool_luks_volume }}"
zfs_ashift: 12
zfs_compression: zstd
zfs_atime: "off"

# One parent dataset per recovery group. A new dataset without an entry here is
# rejected at apply time (roles/storage) and by playbooks/check.yml.
recovery_inventory:
  books:
    visibility: general
    destination_tiers: [primary, secondary, r2]
  memory_external:
    visibility: personal
    destination_tiers: [primary, secondary, r2]
  memory_local:
    visibility: personal
    destination_tiers: [primary, secondary, r2]
  music:
    visibility: personal
    destination_tiers: [primary, secondary, r2]
  notes:
    visibility: personal
    destination_tiers: [primary, secondary, r2]
  photos:
    visibility: personal
    destination_tiers: [primary, secondary, r2]
  wallpapers:
    visibility: personal
    destination_tiers: [primary, secondary, r2]

# Structural parents hold no data and are never mounted themselves.
zfs_container_datasets:
  - name: "{{ zfs_pool }}/memory"
    mountpoint: /srv/memory
    canmount: "off"

zfs_datasets:
  - name: "{{ zfs_pool }}/books"
    mountpoint: /srv/books
    recovery_group: books
    recordsize: 128K
    mode: "0755"
  - name: "{{ zfs_pool }}/memory/external"
    mountpoint: /srv/memory/external
    recovery_group: memory_external
    recordsize: 16K
    mode: "0750"
  - name: "{{ zfs_pool }}/memory/local"
    mountpoint: /srv/memory/local
    recovery_group: memory_local
    recordsize: 16K
    mode: "0750"
  - name: "{{ zfs_pool }}/music"
    mountpoint: /srv/music
    recovery_group: music
    recordsize: 1M
    mode: "0755"
  - name: "{{ zfs_pool }}/notes"
    mountpoint: /srv/notes
    recovery_group: notes
    recordsize: 64K
    mode: "0755"
  - name: "{{ zfs_pool }}/photos"
    mountpoint: /srv/photos
    recovery_group: photos
    recordsize: 1M
    mode: "0755"
  - name: "{{ zfs_pool }}/wallpapers"
    mountpoint: /srv/wallpapers
    recovery_group: wallpapers
    recordsize: 1M
    mode: "0755"

# Restic repositories only. Mounted on demand by the backup units, never at
# boot, and never executed from or written setuid.
backup_mounts:
  - path: /var/backups/primary
    source: /dev/mapper/luks-backup-primary
    fstype: ext4
    options: "noauto,nodev,nosuid,noexec,x-systemd.requires=systemd-cryptsetup@luks-backup-primary.service"
  - path: /var/backups/secondary
    source: /dev/mapper/luks-backup-secondary
    fstype: ext4
    options: "noauto,nodev,nosuid,noexec,x-systemd.requires=systemd-cryptsetup@luks-backup-secondary.service"

# --------------------------------------------------------------------------
# k3s, gVisor, Kata, NVIDIA
# --------------------------------------------------------------------------
# Exact version, never a channel. Bump deliberately after the compatibility
# matrix in docs/manual-steps.md is re-tested.
k3s_version: v1.33.4+k3s1
k3s_disable_components:
  - traefik
  - servicelb
  - metrics-server
k3s_write_kubeconfig_mode: "0600"
k3s_token_file: /etc/rancher/k3s/node-token
# Agents set k3s_server_url in their inventory entry.
k3s_server_url: ""

k3s_enable_gvisor_runtime: true
k3s_enable_kata_runtime: true
k3s_enable_nvidia_runtime: false

gvisor_release: "20241021"

kata_packages:
  - kata-containers
  - qemu-system-x86
kata_package_version: "3.17.*"
kata_runtime_class: kata-qemu

nvidia_driver_package: nvidia-driver-570
nvidia_driver_version: "570.*"
nvidia_container_toolkit_package: nvidia-container-toolkit
nvidia_container_toolkit_version: "1.17.*"

# --------------------------------------------------------------------------
# Data plane
# --------------------------------------------------------------------------
# Digest-pinned images. Empty means "not built yet"; every data-plane playbook
# asserts on `@sha256:<64 hex>` before it writes a unit. Mirrored locally, and
# podman runs with --pull=never so a tag can never silently replace a digest.
data_plane_images:
  backup_controller: ""
  collector_relay: ""
  event_service: ""
  recovery_portal: ""
  write_broker: ""

data_plane_state_root: /var/lib/homelab
data_plane_config_root: /etc/homelab/data-plane
data_plane_secret_root: /etc/homelab/secrets
data_plane_podman_root: /var/lib/homelab/podman
data_plane_run_root: /run/homelab
data_plane_state_uid: 65532
data_plane_state_gid: 65532

# --------------------------------------------------------------------------
# Recovery
# --------------------------------------------------------------------------
# Set on the command line for recover.yml; never store a credential here.
homelab_recovery_confirm: false
homelab_recovery_generation_manifest: ""
homelab_recovery_apply: false
