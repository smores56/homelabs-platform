# The agent's only window into the cluster. It runs in `tenant-apps` because the
# broker reaches it there, it holds a token (the one thing nanobot never gets),
# and its RBAC is the whole capability: nine routes over one read-only view plus
# a pod-template patch on deployments/nanobot. `tenant-gvisor` and
# `tenant-images` apply here, so gVisor and the digest pin are admission-enforced
# as well as declared.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-control
  namespace: tenant-apps
  labels:
    app.kubernetes.io/name: agent-control
    homelabs.dev/tier: tenant
  annotations:
    homelabs.dev/purpose: "cluster API capability for the agent (docs/tenancy.md)"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-control
        homelabs.dev/managed-by: platform
    spec:
      serviceAccountName: agent-control
      # The only automounted tenant token in the cluster. 12-agent-identity
      # still pins `false` for every nanobot-labelled pod, so a copied spec
      # cannot turn one into a second API client.
      automountServiceAccountToken: true
      enableServiceLinks: false
      runtimeClassName: gvisor
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-control
          # Same base digest as apps/broker/Dockerfile (python:3.13-slim). No
          # build step: the source below is the ConfigMap this kustomization
          # generates, so the running code is the reviewed file.
          image: python@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/agent_control.py"]
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: PORT
              value: "8081"
            - name: AGENT_NAMESPACE
              value: tenant-apps
            - name: AGENT_DEPLOYMENT
              value: nanobot
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 192Mi
          # TCP probes on purpose: the HTTP surface stays exactly the nine
          # routes, so there is no token-free /healthz to probe or abuse.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          configMap:
            name: agent-control-source
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 15
