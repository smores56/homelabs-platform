apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One Flux stage (platform-agent-control) applies this tree after the RBAC,
# admission and network stages. The pod lives in `tenant-apps` next to the agent
# it serves, so the broker's `self` logical host reaches it under
# agent-control.tenant-apps.svc.cluster.local:8081 without a second namespace.
#
# The source is mounted from a generated ConfigMap instead of an image build, so
# a code change is a pod rollout (status-exporter pattern). The base image is the
# digest the broker's Dockerfile pins; bump both together.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: homelabs
resources:
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - deployment.yaml
  - service.yaml
  - network.yaml
configMapGenerator:
  - name: agent-control-source
    namespace: tenant-apps
    files:
      - agent_control.py
