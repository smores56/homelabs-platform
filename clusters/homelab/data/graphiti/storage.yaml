# Bound to /mnt/data/graphiti by the PV claimRef in platform/storage.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: graphiti-data
  namespace: graphiti
  labels:
    app.kubernetes.io/name: graphiti
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
    homelabs.dev/managed-by: platform
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: data-local
  resources:
    requests:
      storage: 5Ti
