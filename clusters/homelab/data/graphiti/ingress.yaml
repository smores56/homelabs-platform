# memory.sammohr.dev. The live route still terminates on the host's memory-mcp
# wrapper, which is what maki and the personal sessions authenticate against;
# repointing this hostname at the raw MCP here would publish an unauthenticated
# endpoint. The cutover (wrapper in-cluster or the host wrapper pointed at this
# Service) is a live step, recorded in docs/data-migration.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphiti
  namespace: graphiti
  labels:
    app.kubernetes.io/name: graphiti
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  rules:
    - host: memory.sammohr.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graphiti
                port:
                  number: 8184
