# The wrapper's own export, not a bare sqlite copy: it snapshots the registry
# with the online backup API, writes episodes.jsonl (readable without SQLite),
# and takes FalkorDB's dump through BGSAVE. It refuses to run while a restore's
# `.restore-in-progress` lock exists, which is what keeps a half-restored state
# from being backed up over.
#
# Runs at 02:20, before graphiti-dump (02:45) — both trigger an RDB save on the
# same FalkorDB, and an overlapping save makes the export's rewrite check fail —
# and well before the host's restic walk (03:30 Europe/Berlin, up to 03:45 with
# its delay). The artefact lands on the share, so restic picks it up with
# everything else under /var/lib/data.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: memory-export
  namespace: graphiti
  labels:
    app.kubernetes.io/name: memory-export
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  schedule: "20 2 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: memory-export
            app.kubernetes.io/part-of: homelabs
            homelabs.dev/tier: data
            homelabs.dev/managed-by: platform
        spec:
          serviceAccountName: data-workload
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: export
              # Same image as the wrapper: one artefact, one schema version.
              # Published by nix-config's publish-memory workflow.
              image: ghcr.io/smores56/nix-config/memory-mcp@sha256:a63814a12802b11c92d7354d50bd52b4469dd26df51b11cf7ca49fa680df8241
              command:
                - memory-export
                - export
              args:
                - --root
                - /data/db-dumps/memory
                - --state-dir
                - /data/memory
                - --graph-dir
                - /data/falkordb
                - --graph-url
                - redis://graphiti-falkordb:6379
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: graphiti-data
            - name: tmp
              emptyDir: {}
