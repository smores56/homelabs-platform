# The graph store. AOF on the share, no scheduled RDB saves (a BGSAVE spike on a
# 15 GiB guest is what the host avoids too); the nightly dump is the portable
# artifact. No authentication: the boundary is the default-deny NetworkPolicy
# plus the port that only this namespace's peers may reach.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphiti-falkordb
  namespace: graphiti
  labels:
    app.kubernetes.io/name: graphiti-falkordb
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: graphiti-falkordb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphiti-falkordb
        app.kubernetes.io/part-of: homelabs
        homelabs.dev/tier: data
        homelabs.dev/managed-by: platform
    spec:
      serviceAccountName: data-workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data
          image: busybox:1.37.0
          command: ["sh", "-c", "mkdir -p /data/falkordb /data/db-dumps"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: falkordb
          # Same digest as the host (modules/features/ai/memory/service.nix).
          image: falkordb/falkordb-server:v4.22.2@sha256:103b70949bc9019dd025e62e077665349b73e96add5c45738e73ddf73eef6220
          env:
            # The image's run.sh appends its own
            # `--dir "${FALKORDB_DATA_PATH}"` (/var/lib/falkordb/data) after
            # REDIS_ARGS, so a --dir here would only be overridden; the PVC is
            # mounted at that exact path instead. `--save ""` disables RDB
            # snapshots.
            - name: REDIS_ARGS
              value: '--appendonly yes --appendfsync everysec --save ""'
            - name: TZ
              value: UTC
          ports:
            - name: falkordb
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            # FalkorDB writes module state under its own prefix as well as the
            # configured data dir; keep the image's rootfs writable.
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The image hardcodes FALKORDB_DATA_PATH=/var/lib/falkordb/data:
            # run.sh mkdirs it (EACCES under the image's root-owned prefix) and
            # redis writes the AOF there. subPath `falkordb` is the share's
            # subdirectory (docs/data-migration.md), created by prepare-data on
            # the /data mount before this container starts. No emptyDir on the
            # parent: it would hide the image's bin/ (ENTRYPOINT) and nothing
            # writes to the prefix itself (TLS is off, RDB saves are off).
            - name: data
              mountPath: /var/lib/falkordb/data
              subPath: falkordb
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: graphiti-data
        - name: tmp
          emptyDir: {}
