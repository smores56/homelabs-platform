apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: graphiti

# Graphiti's memory store on FalkorDB, with the same images, ports and config as
# modules/features/ai/memory/service.nix on the host. Extraction calls the
# Neuralwatt API directly: the key comes from the neuralwatt-api-key Secret,
# which ESO projects from the SOPS contract (platform/secrets/eso).
#
# The MCP wrapper (auth, project groups, reconciler) also runs here since the
# cutover. Its clients reach it two ways: the host's tap NodePort (kept until the
# host forwarder is retired) and, since SDLC #617, the cluster tunnel via
# `memory.sammohr.dev`. The route is Cloudflare-side (tofu/cluster.tf), so this
# namespace still publishes no Ingress object of its own.
resources:
  - storage.yaml
  - configmap.yaml
  - falkordb.yaml
  - deployment.yaml
  - services.yaml
  - memory-mcp.yaml
  - memory-export-cronjob.yaml
  - dump-cronjob.yaml
  - restic-contract.yaml
  - restic-backup.yaml
  - restic-preflight.yaml
