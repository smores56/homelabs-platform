# OPDShelf serves the Calibre library straight from the `books` share. The
# folder tree is the catalog — no database, no ingest step, no second writer:
# metadata edits, custom covers and thumbnails live in `books/.opdshelf`.
#
# It replaces Calibre-Web-Automated (SDLC #509). That image needed an s6 root
# preinit, and its ingest pipeline owned the library, which left the agent with
# no simple write path. Here a file written to the share is simply a book.
#
# Credentials are environment variables, so the admin password comes from the
# SOPS contract (`opdshelf-admin-password-sops` -> `opdshelf-admin`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre
  namespace: calibre
  labels:
    app.kubernetes.io/name: calibre
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  replicas: 1
  # One writer on the share: `.opdshelf` is rewritten in place.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: calibre
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calibre
        app.kubernetes.io/part-of: homelabs
        homelabs.dev/tier: data
        homelabs.dev/managed-by: platform
    spec:
      serviceAccountName: data-workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opdshelf
          image: docker.io/koalilla/opds-server@sha256:b82f94f72b41686fd9169a2269d65550f411a97dfa341a330df88b0bfab0af35
          envFrom:
            - configMapRef:
                name: opdshelf-env
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opdshelf-admin
                  key: password
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /books
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: calibre-data
        - name: tmp
          emptyDir: {}
