apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: calibre

# OPDShelf over the existing Calibre library (`books` share). The library is
# not converted and not copied: the folder tree is the catalog.
resources:
  - storage.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - restic-contract.yaml
  - restic-backup.yaml
  - restic-preflight.yaml
