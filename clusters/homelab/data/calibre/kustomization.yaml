apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: calibre

# Calibre-Web over the existing Calibre library (`books` share). The library is
# not converted and not copied: it is the same metadata.db the host's
# calibre-server reads today.
resources:
  - storage.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
