# OPDShelf has its own login (Basic auth for readers, a form for the panel).
# See clusters/homelab/data/immich/ingress.yaml for the Ingress-object rationale.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opdshelf
  namespace: opdshelf
  labels:
    app.kubernetes.io/name: opdshelf
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  rules:
    - host: opds.sammohr.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opdshelf
                port:
                  number: 8083
