apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich

# Immich 3.0.3 (the version nixpkgs pins for smortress): server, machine-learning,
# Postgres and Valkey, all on the `immich` share through the immich-data claim.
resources:
  - storage.yaml
  - postgres-settings.yaml
  - postgres.yaml
  - valkey.yaml
  - server.yaml
  - machine-learning.yaml
  - services.yaml
  - ingress.yaml
  - dump-cronjob.yaml
