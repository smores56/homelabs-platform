# Immich's database. PGDATA is /data/postgres on the share, so the same bytes the
# host's restic job walks are the live cluster (no copy at cutover). The image is
# Immich's own Postgres 17 build: the host runs 17.10 and the dump/restore path
# between the two is same-major.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-postgres
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  replicas: 1
  # One writer on one PVC: never two Postgres pods on the share at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-postgres
        app.kubernetes.io/part-of: homelabs
        homelabs.dev/tier: data
        homelabs.dev/managed-by: platform
    spec:
      serviceAccountName: data-workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data
          image: busybox:1.37.0
          command: ["sh", "-c", "mkdir -p /data/postgres /data/db-dumps /data/library"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:17-vectorchord0.4.3-pgvector0.8.1
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: PGDATA
              value: /data/postgres
            - name: TZ
              value: UTC
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            # The image's entrypoint copies its config template into this
            # directory and seds PGDATA into the copy (`cp -n` +
            # `sed -i .../postgresql.conf`), so it must be writable even on a
            # read-only rootfs. The image ships no files here (its Dockerfile
            # only `chmod 1777 /etc/postgresql`); the template is read from
            # /var/postgresql-conf-tpl, so an emptyDir loses nothing.
            - name: etc-postgresql
              mountPath: /etc/postgresql
            # The generated postgresql.conf carries
            # `include_if_exists 'postgresql.override.conf'`, resolved next to
            # the config file, so the data-tenant log settings land without
            # rewriting the image's template: the second consumption shape in
            # postgres-settings.yaml.
            - name: settings
              mountPath: /etc/postgresql/postgresql.override.conf
              subPath: data-settings.conf
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-data
        - name: etc-postgresql
          emptyDir: {}
        - name: settings
          configMap:
            name: postgres-data-settings
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
