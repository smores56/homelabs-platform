apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: navidrome

# Navidrome serves the music library read-only over Subsonic/OPDS. The library is
# the `music` share; the database and cache live in `navidrome/` on the same
# share so the host's restic walk still covers them.
resources:
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - restic-contract.yaml
  - restic-backup.yaml
  - restic-preflight.yaml
