# Tree backup for the navidrome share (SDLC #619): restic in the app's own
# namespace, writing to the `restic-backup` bucket under `trees/navidrome`.
#
# One job per tree, because a pod may mount only its own namespace's claim
# (`data-pvc-scope`) and the four pre-bound PVs cannot be mounted together. It
# runs as uid 1000 — the share's owner through the guest's virtiofs translation —
# with the claim mounted read-only, so the only bytes it can read are the ones
# the app itself could read. `restic-preflight` proves that before a run counts.
#
# Schedule: the dumps are complete by 03:15 and the host's restic walk starts at
# 03:30 (up to 03:45 with its delay); 05:00 keeps the two walks off the same
# virtiofs link. The host timer stays the R2 owner for this tree until the
# drill in `restic-contract` passes, so both may run: they write different
# repositories.
#
# Deadline: four hours, sized for the first upload and not for a nightly
# incremental, which is minutes. The first job reads the whole tree — ~83 GB at
# the 18 MB/s measured on 2026-11-14 is ~1.3 h — and a deadline that only fits an
# incremental kills it `DeadlineExceeded`, which deletes the pod before anyone
# reads its log. A slow night still fits in four hours; a hung run cannot hold
# the repository past it.
#
# Excluded: nothing: every file in the tree is snapshotted
#
# Retention matches the host's (`--keep-daily 14 --keep-weekly 8
# --keep-monthly 12`), but over this tree's own repository, so a prune here can
# never reach another tree's history.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-backup
  namespace: navidrome
  labels:
    app.kubernetes.io/name: restic
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  schedule: "0 5 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restic
            app.kubernetes.io/part-of: homelabs
            homelabs.dev/tier: data
            homelabs.dev/managed-by: platform
        spec:
          serviceAccountName: data-workload
          automountServiceAccountToken: false
          # `Never` and not `OnFailure`: a container that fails is restarted in place, so
          # the crash loop is one pod the Job controller deletes when the backoff limit
          # is spent — and the log that says why goes with it. `Never` leaves every
          # failed attempt as its own pod for `ttlSecondsAfterFinished` to expire.
          restartPolicy: Never
          # No fsGroup: it would recursively chown the share. The credentials
          # Secret is mounted world-readable instead (see restic-contract).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # Manifest-list digest of 0.18.1; the tag stays for readability.
              # Re-pin with `crane digest docker.io/restic/restic:0.18.1`.
              image: docker.io/restic/restic:0.18.1@sha256:39d9072fb5651c80d75c7a811612eb60b4c06b32ffe87c2e9f3c7222e1797e76
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # The first run creates the repository. `cat config` is the
                  # read probe first, so a wrong endpoint or key fails there
                  # instead of half-writing a new repository.
                  restic cat config >/dev/null 2>&1 || restic init
                  # A run killed mid-`check` leaves an exclusive lock behind, and every
                  # later prune and check then fails on it before doing any work.
                  # `unlock` drops only locks past the stale threshold, so it cannot
                  # disturb a live run.
                  restic unlock
                  # `--json` makes restic emit a status record per update, with a
                  # real byte total from the walk and its own ETA; the text
                  # progress only draws on a TTY, which a Job never has.
                  restic backup --json --host cluster-navidrome --tag cluster \
                    /data
                  restic forget --retry-lock 10m --host cluster-navidrome \
                    --keep-daily 14 --keep-weekly 8 --keep-monthly 12 --prune
                  # Metadata check: a repository that cannot be read is not a
                  # backup. The bounded data read is the weekly preflight's job.
                  restic check --retry-lock 10m
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://385f7d47e2e8438fbda5d6f76d760434.r2.cloudflarestorage.com/restic-backup/trees/navidrome
                - name: AWS_DEFAULT_REGION
                  value: auto
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: RESTIC_PASSWORD
                # readOnlyRootFilesystem; restic keeps its index cache in /tmp.
                - name: RESTIC_CACHE_DIR
                  value: /tmp/restic-cache
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: UTC
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: navidrome-data
                readOnly: true
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
