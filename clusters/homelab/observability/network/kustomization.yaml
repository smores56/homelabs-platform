apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The two sanctioned paths out of observability, both from the broker: the
# gateway (tenant `data` logs) and the status exporter (data workload state).
# Everything else here is reachable only from inside the cluster, and every
# untrusted tier is already default-deny with egress to the broker alone.
resources:
  - loki-gateway-from-broker.yaml
  - broker-to-loki-gateway.yaml
  - status-exporter-from-broker.yaml
  - broker-to-status-exporter.yaml
