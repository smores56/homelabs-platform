apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The observability namespace is default-deny in both directions. Every file
# here is one explicit flow: writes to Loki, reads through the gateway, scrapes,
# API access, and the two broker paths. The digest's own egress and its two
# `*-from-digest` ingress policies live with the digest stage
# (clusters/homelab/platform/digest/), which is applied after this one.
# `alerting-flows.yaml` is the Prometheus -> Alertmanager -> mail relay path, and
# the relay's 443 egress is the namespace's only public one.
resources:
  - default-deny.yaml
  - dns-egress.yaml
  - kubernetes-api-egress.yaml
  - loki-flows.yaml
  - prometheus-flows.yaml
  - loki-gateway-from-broker.yaml
  - broker-to-loki-gateway.yaml
  - status-exporter-from-broker.yaml
  - broker-to-status-exporter.yaml
  - alerting-flows.yaml
