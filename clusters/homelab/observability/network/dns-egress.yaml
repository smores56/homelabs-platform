# Cluster DNS is the only egress every pod in the namespace gets. Scoped to the
# kube-system namespace label rather than a CIDR, so a renumbered cluster or a
# second resolver keeps working.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: observability
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
