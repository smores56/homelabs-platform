# Three pods in this namespace talk to the API server. The API server is not a
# pod (kube-apiserver runs on the host in k3s), so a podSelector cannot express
# it. A client dials the `kubernetes` ClusterIP on 443, but the packet the
# policy sees is the post-DNAT node address on 6443 — and kube-router matches
# the destination range and port independently, so the same rule has to name
# both ranges on both ports. Without the 6443 half the connector is rejected
# with ICMP, which a client reports as "connection refused".
#
#   vector          watches pods/namespaces to attach metadata and the tier label
#   prometheus      `kubernetes_sd_configs` pod discovery
#   status-exporter reads nodes, pods and workloads with its RoleBindings
#
# Loki and the gateway have no API access and are not selected here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-api-egress
  namespace: observability
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["vector", "prometheus", "status-exporter"]
  policyTypes: ["Egress"]
  egress:
    - to:
        # The k3s service range a client names, and the `cluster` guest's own
        # address it is translated to (10.77.1.2/30 tap, nix-config
        # modules/lib/vm-host.nix index 1) where k3s serves the API.
        - ipBlock:
            cidr: 10.43.0.0/16
        - ipBlock:
            cidr: 10.77.1.0/30
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
