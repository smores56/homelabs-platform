# The alerting path (SDLC #620, #649), stated on both ends of every hop:
#
#   prometheus   -> alertmanager 9093   push firing alerts (`/api/v2/alerts`)
#   alertmanager -> notifyrelay 8080    webhook delivery
#   flux-system  -> notifyrelay 8080    reconcile failures (Flux `Alert`)
#   notifyrelay  -> ntfy 8080           one publish per batch, topic `alerts`
#
# The relay no longer leaves the cluster: it posts to the bus's Service, so this
# namespace has no public egress at all. That is the point — a cluster alert must
# not depend on the tunnel it may be reporting on, and the bus is in-cluster.
#
# The notify-side half of the last hop is in clusters/homelab/notify/
# networkpolicy.yaml; both ends are stated so neither depends on the other's file
# being applied first (webhook-flows.yaml precedent).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-to-alertmanager
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9093
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-from-prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9093
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-to-notifyrelay
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notifyrelay
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notifyrelay-from-senders
  namespace: observability
  labels:
    app.kubernetes.io/name: notifyrelay
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notifyrelay
  policyTypes: ["Ingress"]
  ingress:
    # Alertmanager posts `/alert`; the notification-controller posts `/flux`.
    # `flux-system` is not default-deny, so only this end needs stating.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
          podSelector:
            matchLabels:
              app: notification-controller
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notifyrelay-egress-notify
  namespace: observability
  labels:
    app.kubernetes.io/name: notifyrelay
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notifyrelay
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: notify
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ntfy
      ports:
        - protocol: TCP
          port: 8080
