# Default deny in both directions for the observability namespace. The paths
# below are the complete set and each one is its own file:
#
#   vector            -> Loki 3100                    (tenant writes)
#   loki-gateway      -> Loki 3100                    (read upstream)
#   prometheus        -> annotated targets            (scrape)
#   prometheus        -> status-exporter 9101         (scrape)
#   broker            -> loki-gateway / status-exporter
#   cluster-digest    -> loki-gateway / status-exporter (platform stage)
#   vector, prometheus, status-exporter -> Kubernetes API 443
#   prometheus        -> alertmanager 9093            (alert push)
#   alertmanager      -> notifyrelay 8080             (webhook)
#   flux-system       -> notifyrelay 8080             (reconcile failures)
#   notifyrelay       -> notify/ntfy 8080             (one publish per batch)
#
# Loki, the gateway, the exporter, Alertmanager and the relay have no egress
# beyond the above. Nothing in this namespace reaches the internet: this
# namespace never reaches GitHub, Neuralwatt, R2 or Cloudflare.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: observability
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
