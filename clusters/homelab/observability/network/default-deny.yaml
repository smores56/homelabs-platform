# Default deny in both directions for the observability namespace. The paths
# below are the complete set and each one is its own file:
#
#   vector            -> Loki 3100                    (tenant writes)
#   loki-gateway      -> Loki 3100                    (read upstream)
#   prometheus        -> annotated targets            (scrape)
#   prometheus        -> status-exporter 9101         (scrape)
#   broker            -> loki-gateway / status-exporter
#   cluster-digest    -> loki-gateway / status-exporter (platform stage)
#   vector, prometheus, status-exporter -> Kubernetes API 443
#   prometheus        -> alertmanager 9093            (alert push)
#   alertmanager      -> mailrelay 8080               (webhook)
#   mailrelay         -> Cloudflare API 443           (the one public path)
#
# Loki, the gateway, the exporter and Alertmanager have no egress beyond the
# above. Only the mail relay reaches the internet, and only on 443: this
# namespace never reaches GitHub, Neuralwatt or R2.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: observability
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
