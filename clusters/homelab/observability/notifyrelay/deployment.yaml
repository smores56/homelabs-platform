# The cluster's path to the notification bus (SDLC #620, #649). Alertmanager
# posts its webhook payload to `/alert` and Flux's notification-controller posts
# its generic-provider payload to `/flux`; this process turns each into one ntfy
# publish on topic `alerts`, so cluster alerts and reconcile failures arrive on
# the same bus as host unit failures.
#
# It is deliberately dumb: no template engine, no deduplication, no queue. A 200
# means ntfy accepted the message; a 502 makes the sender retry (Alertmanager
# from its notification log, Flux on the next event).
#
# It posts to the in-cluster Service, not `ntfy.sammohr.dev`: it has no
# `allow_private` rule to honour, and cluster alerts must not depend on the
# tunnel they may be reporting on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifyrelay
  labels:
    app.kubernetes.io/name: notifyrelay
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: notifyrelay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifyrelay
        app.kubernetes.io/part-of: homelabs
        homelabs.dev/tier: observability
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: notifyrelay
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notifyrelay
          # Source from the generated ConfigMap: a change is a pod rollout, and
          # the unit tests in tests/observability run this exact file.
          image: python:3.13.12-slim
          command: ["python", "-u", "/app/notifyrelay.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # The Service, not the public hostname: see the header comment.
            - name: NTFY_URL
              value: http://ntfy.notify.svc.cluster.local:8080
            - name: NTFY_TOPIC
              value: alerts
            - name: NTFY_TOKEN_FILE
              value: /etc/notifyrelay/token
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
            - name: token
              mountPath: /etc/notifyrelay
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          configMap:
            name: notifyrelay-source
        - name: token
          secret:
            secretName: notifyrelay-token
            # Readable by the pod uid: no fsGroup, so kubelet would otherwise
            # leave this root-owned and unreadable.
            defaultMode: 0444
            optional: false
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notifyrelay
  labels:
    app.kubernetes.io/name: notifyrelay
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notifyrelay
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notifyrelay
  labels:
    app.kubernetes.io/name: notifyrelay
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
automountServiceAccountToken: false
