# A stock python image running a stdlib proxy: no build pipeline, no
# dependencies, constant-time token comparison, and one forced tenant. The
# Secret is produced by the suspended ESO stage in ./eso, so this pod stays
# Pending (fail closed) until an operator installs ESO and resumes the stage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-gateway
  namespace: observability
  labels:
    app.kubernetes.io/name: loki-gateway
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-gateway
        app.kubernetes.io/part-of: homelabs
        homelabs.dev/tier: observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki-gateway
          image: python:3.13.12-slim
          command: ["python", "-u", "/app/gateway.py"]
          ports:
            - name: http
              containerPort: 3100
          env:
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: LISTEN_PORT
              value: "3100"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: LOKI_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loki-gateway-token
                  key: password
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          configMap:
            name: loki-gateway-source
        - name: tmp
          emptyDir: {}
