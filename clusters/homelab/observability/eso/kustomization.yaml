apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applied by the suspended platform-observability-secrets stage: the CRDs come
# from the External Secrets operator, which this repository does not install.
# Resuming the stage is a manual step (docs/manual-steps.md).
#
# Two credential kinds: the Loki gateway token is a Password generator (minted
# here), and the notify relay token is a projection of a SOPS Secret the operator
# creates (docs/manual-steps.md step 29).
resources:
  - secretstore.yaml
  - password-generator.yaml
  - externalsecret.yaml
  - notify-relay.yaml
