# The Cloudflare Email Service token the mail relay posts with. Never in a
# ConfigMap, never in git: `alertmanager-mail-sops` is a SOPS+age Secret in this
# namespace (created by hand, docs/manual-steps.md step 29), and this projection
# gives the Deployment the `mailrelay-token` name and the `token` key its
# `mailrelay-contract` ConfigMap records.
#
# The token is scoped to Email Sending: Edit on the account. Rotation is:
# replace the SOPS Secret, let ESO re-read it (1h) or delete the projected
# Secret, then revoke the old token — nothing restarts, because the relay reads
# the file on every POST.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mailrelay-token
  namespace: observability
  labels:
    app.kubernetes.io/name: mailrelay
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sops-contract
    kind: SecretStore
  target:
    name: mailrelay-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: alertmanager-mail-sops
        property: token
