# The generated Secret is named exactly `loki-gateway-token` because
# vector/daemonset.yaml and loki-gateway/deployment.yaml read
# `password` from it. `refreshInterval: "0"` pins the value across reconciles.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-gateway-token
  namespace: observability
  labels:
    app.kubernetes.io/name: loki-gateway
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  refreshInterval: "0"
  target:
    name: loki-gateway-token
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: loki-gateway-token
