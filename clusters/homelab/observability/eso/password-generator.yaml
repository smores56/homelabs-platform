# Machine-generated, never committed. refreshInterval 0 on the ExternalSecret
# means the value is minted once; rotating it is "delete the Secret and let the
# generator run again", after which Vector and the broker both roll.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: loki-gateway-token
  namespace: observability
  labels:
    app.kubernetes.io/name: loki-gateway
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  length: 48
  digits: 12
  symbolCharacters: "-_"
  noUpper: false
  allowRepeat: true
