# `local-path` is the repo's own provisioner (platform/storage/
# local-path-provisioner.yaml); the k3s addon is disabled. On a single node it is
# the only dynamic class. 10 Gi holds 7 days of a handful of targets at 30s.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
