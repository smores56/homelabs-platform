# Prometheus reads pod metadata for the annotated-pods scrape job; it needs no
# write access and is bound by a ClusterRole with pods get/list/watch only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
automountServiceAccountToken: true
