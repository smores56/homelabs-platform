# Scrapes the human-owned status exporter (the only sanctioned view of data
# workloads) and any pod that opts in with `prometheus.io/scrape: "true"`.
# Retention is capped by both time and bytes so a stuck target cannot fill the
# 10 Gi claim on a single node.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

# Alert rules live in rules.yaml, mounted beside this file.
rule_files:
  - /etc/prometheus/rules/rules.yaml

# Alerts are pushed to the in-namespace Alertmanager, which routes them to the
# mail relay. `alertmanager` is a cluster-local Service: nothing outside the
# namespace can reach it, and this is the only writer.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager.observability.svc.cluster.local:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: status-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["status-exporter.observability.svc.cluster.local:9101"]

  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: (.+);(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
