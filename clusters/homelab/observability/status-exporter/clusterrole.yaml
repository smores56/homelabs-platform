apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-status-exporter
  labels:
    app.kubernetes.io/name: status-exporter
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
# Namespace-scoped rules only. It is bound by one RoleBinding per data namespace
# (observability/rbac-data.yaml), so it cannot read pods anywhere else. The
# cluster-scoped `nodes` read lives in its own ClusterRole, because a
# ClusterRoleBinding grants *every* rule of the role it names.
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
  # CronJob freshness is what the backup alerts compare against wall-clock time;
  # `batch` is read-only here like everything else in this role.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
