apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-status-exporter
  labels:
    app.kubernetes.io/name: status-exporter
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
