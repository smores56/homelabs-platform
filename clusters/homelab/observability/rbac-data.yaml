# Lives at the observability root, not under status-exporter/: that
# sub-kustomization sets `namespace: observability`, and the namespace
# transformer would rewrite this binding out of `data` (its whole point).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-status-exporter
  namespace: data
  labels:
    app.kubernetes.io/name: status-exporter
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observability-status-exporter
subjects:
  - kind: ServiceAccount
    name: status-exporter
    namespace: observability
