# The only workload that reads container logs from the node. hostPath is
# confined to /var/log/pods (read-only) and the checkpoint directory; the
# observability namespace is the one namespace whose PSA profile allows it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/part-of: homelabs
        homelabs.dev/tier: observability
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8686"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: vector
      automountServiceAccountToken: true
      securityContext:
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # A hostPath directory is created root-owned, so one root init container
      # hands the checkpoint directory to the vector user; the agent itself
      # never runs as root and never writes outside /var/lib/vector.
      initContainers:
        - name: volume-permissions
          image: busybox:1.37.0
          command: ["sh", "-c", "mkdir -p /var/lib/vector && chown 10001:10001 /var/lib/vector"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/vector
      containers:
        - name: vector
          image: timberio/vector:0.61.0-debian
          args:
            - --config
            - /etc/vector/vector.yaml
          ports:
            - name: api
              containerPort: 8686
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VECTOR_LOG
              value: warn
            # ESO Password generator (observability/loki-gateway/eso). Absent
            # secret means the pod does not start, so no data line is ever
            # written without the token the gateway expects.
            - name: LOKI_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loki-gateway-token
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/vector/vector.yaml
              subPath: vector.yaml
              readOnly: true
            - name: vrl
              mountPath: /etc/vector/vrl
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: vrl
          configMap:
            name: vector-vrl
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
