# The log source resolves pod and namespace metadata through the API; the token
# is the only credential the DaemonSet holds.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
automountServiceAccountToken: true
