# The mail path for every cluster alert (SDLC #620). Alertmanager posts its
# webhook payload here; this process turns it into the same Cloudflare Email
# Service call the host's `cloudflare-email@` units make, so cluster and host
# failures arrive from one verified sender.
#
# It is deliberately dumb: no template engine, no deduplication, no queue. A
# 200 means Cloudflare accepted the message; a 502 makes Alertmanager retry from
# its notification log.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailrelay
  labels:
    app.kubernetes.io/name: mailrelay
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mailrelay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailrelay
        app.kubernetes.io/part-of: homelabs
        homelabs.dev/tier: observability
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: mailrelay
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailrelay
          # Source from the generated ConfigMap: a change is a pod rollout, and
          # the unit tests in tests/observability run this exact file.
          image: python:3.13.12-slim
          command: ["python", "-u", "/app/mailrelay.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Identifiers, not credentials: the account tag and the addresses
            # the host's sender already uses (modules/nixos/alerting.nix).
            - name: CF_ACCOUNT_ID
              value: 385f7d47e2e8438fbda5d6f76d760434
            - name: MAIL_FROM
              value: alerts@send.sammohr.dev
            - name: MAIL_TO
              value: sam@sammohr.dev
            - name: CF_API_TOKEN_FILE
              value: /etc/mailrelay/token
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
            - name: token
              mountPath: /etc/mailrelay
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          configMap:
            name: mailrelay-source
        - name: token
          secret:
            secretName: mailrelay-token
            # Readable by the pod uid: no fsGroup, so kubelet would otherwise
            # leave this root-owned and unreadable.
            defaultMode: 0444
            optional: false
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mailrelay
  labels:
    app.kubernetes.io/name: mailrelay
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailrelay
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mailrelay
  labels:
    app.kubernetes.io/name: mailrelay
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
automountServiceAccountToken: false
