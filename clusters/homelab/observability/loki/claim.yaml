# Same single-node provisioner as Prometheus. 10 Gi at 168h retention; Vector
# refuses to batch faster than Loki can compact.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: observability
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
