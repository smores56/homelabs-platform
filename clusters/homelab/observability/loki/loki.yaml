# Single-binary Loki for one node. `auth_enabled: true` is the point of this
# file: every write and read must name a tenant, Vector writes `raw` directly and
# reaches `data` only through loki-gateway, which injects the header after
# checking its bearer token (docs/observability.md).
auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  grpc_server_max_concurrent_streams: 100

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/loki
  storage:
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# v13/tsdb is the current schema; 2024-04-01 is safely in the past for a new
# install, so no legacy index is ever opened.
schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_lookback: 168h
  # The data tenant ships structured classification, not a log body, so its
  # lines stay small; the limit still applies to both tenants.
  max_query_series: 500
  allow_structured_metadata: true

compactor:
  working_directory: /var/loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m

ruler:
  storage:
    type: local
    local:
      directory: /var/loki/rules
  rule_path: /var/loki/rules-temp
  enable_api: false

analytics:
  reporting_enabled: false

# A single node has nothing to query-frontend over the network; keeping the
# embedded cache off saves memory on the 15 GB guest.
query_range:
  align_queries_with_step: true
  cache_results: false
