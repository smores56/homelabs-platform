apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The receiver is platform-owned: its capability store, its tokens and its one
# egress are reviewed here. The tenant repository cannot read or change any of
# them, and the pods have no API access at all.
namespace: webhook
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: homelabs
      homelabs.dev/tier: webhook
resources:
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - sops-contract.yaml
