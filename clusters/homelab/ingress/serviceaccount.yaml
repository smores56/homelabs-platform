# No API access: the connector needs no token because its tunnel token is
# scoped to the tunnel itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  namespace: ingress
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: ingress
automountServiceAccountToken: false
