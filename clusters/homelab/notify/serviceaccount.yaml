# ntfy calls no Kubernetes API: the cache and the auth database live on its own
# claim, and the tokens arrive as environment variables from the projected
# Secret. The token is never mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ntfy
  labels:
    app.kubernetes.io/name: ntfy
    homelabs.dev/tier: notify
automountServiceAccountToken: false
