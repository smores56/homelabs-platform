apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The notification bus is platform-owned: its claim holds every message and the
# auth database, and its tokens are projected from a SOPS Secret. The tenant
# repository cannot read or change any of them, and the pod has no API access.
#
# The ExternalSecret is not here: it lives in `eso/` and is applied by the
# `platform-notify-secrets` stage, because the operator's CRDs are installed by
# hand (docs/manual-steps.md step 8) and are not part of this repository.
namespace: notify
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: homelabs
      homelabs.dev/tier: notify
resources:
  - serviceaccount.yaml
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
