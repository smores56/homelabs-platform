# The credential contract for this namespace's ESO reads. ESO cannot use its own
# ServiceAccount to read Secrets (v2 refuses it by design), so the store gets a
# namespace-local identity with read-only Secret access; the Secret it reads is
# `ntfy-auth-sops`, created by hand (docs/manual-steps.md step 24).
#
# The same four objects as observability/eso/secretstore.yaml, scoped to this
# namespace: a store that could read another namespace's Secrets would make the
# per-namespace split pointless.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sops-contract
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: notify
spec:
  provider:
    kubernetes:
      remoteNamespace: notify
      # The API server's certificate is signed by the cluster CA, which is not a
      # system root; kube-root-ca.crt is the per-namespace copy of it.
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: sops-contract
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sops-contract
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: notify
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sops-contract-reader
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: notify
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # The store reconciler validates its own permissions with this review.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sops-contract-reader
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: notify
subjects:
  - kind: ServiceAccount
    name: sops-contract
    namespace: notify
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sops-contract-reader
