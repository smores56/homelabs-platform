# Three keys, one Secret: the users, the tokens and the ACL. All three are
# provisioned by ntfy at startup into auth.db, so a lost claim re-provisions
# from here instead of losing the tokens.
#
# `refreshInterval: 1h` rather than `0`: a rotation should reach the pod without
# a manual delete, and the Deployment reads the values as environment variables,
# so the operator restarts it after a change (docs/manual-steps.md step 24).
#
# The first apply is the exception. Flux creates this before the operator has
# created `ntfy-auth-sops`, so the initial reconcile fails with `could not get
# secret data from provider` and the pod waits on a Secret that does not exist.
# `force-sync` is the lever there, not a delete: `creationPolicy: Owner` and
# nothing was ever created, so there is nothing to delete.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-auth
  labels:
    app.kubernetes.io/name: ntfy
    homelabs.dev/tier: notify
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sops-contract
    kind: SecretStore
  target:
    name: ntfy-auth
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: ntfy-auth-sops
        property: users
    - secretKey: tokens
      remoteRef:
        key: ntfy-auth-sops
        property: tokens
    - secretKey: access
      remoteRef:
        key: ntfy-auth-sops
        property: access
