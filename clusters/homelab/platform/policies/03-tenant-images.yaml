# Tenant images are digest-pinned and nanobot comes from exactly one
# repository. A mutable tag lets whoever controls the registry swap the code
# that runs with the tenant identity; the digest check removes that.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-images
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.image.matches('^[A-Za-z0-9._/-]+(:[0-9]+)?@sha256:[a-f0-9]{64}$'))
      message: "tenant images must be pinned by @sha256 digest"
    - expression: >-
        variables.containers.all(c,
          !c.image.matches(':(latest|main|master|edge|stable|dev)(@|$)'))
      message: "tenant images must not use a floating tag"
    - expression: >-
        !has(object.metadata.labels)
        || !('app.kubernetes.io/name' in object.metadata.labels)
        || object.metadata.labels['app.kubernetes.io/name'] != 'nanobot'
        || variables.containers.all(c, c.image.startsWith('ghcr.io/smores56/nix-config/nanobot@sha256:'))
      message: "nanobot pods must run ghcr.io/smores56/nix-config/nanobot pinned by digest"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-images
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  policyName: tenant-images
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: homelabs.dev/tier
          operator: In
          values: ["tenant"]
