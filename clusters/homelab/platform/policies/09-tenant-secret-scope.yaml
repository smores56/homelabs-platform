# The age identity decrypts every SOPS file in the tenant namespace. A pod that
# mounts it hands that identity to agent code, so the Secret is unnameable from
# a tenant pod even though the tenant cannot read Secrets through the API
# either. Derived machine secrets (ESO-generated) stay mountable.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-secret-scope
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
    - name: volumes
      expression: "has(object.spec.volumes) ? object.spec.volumes : []"
  validations:
    - expression: "variables.volumes.all(v, !has(v.secret) || v.secret.secretName != 'sops-age')"
      message: "tenant pods must not mount the sops-age Secret"
    - expression: >-
        variables.containers.all(c,
          !has(c.env)
          || c.env.all(e,
            !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || e.valueFrom.secretKeyRef.name != 'sops-age'))
      message: "tenant pods must not read the sops-age Secret through env"
    - expression: >-
        variables.containers.all(c,
          !has(c.envFrom)
          || c.envFrom.all(f, !has(f.secretRef) || f.secretRef.name != 'sops-age'))
      message: "tenant pods must not read the sops-age Secret through envFrom"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-secret-scope
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  policyName: tenant-secret-scope
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: homelabs.dev/tier
          operator: In
          values: ["tenant"]
