# Every 15 minutes (UTC, so the `generated_at` cursor the host writer keeps is
# monotonic across a DST shift). Each run publishes one snapshot and replaces
# `latest.json` atomically; 96 snapshots is 24 hours of history.
#
# The only secret is the ESO-generated `loki-gateway-token`, mounted as a file.
# It is the same token the broker and Vector use, scoped by the gateway to the
# `data` tenant; the pod never talks to the Kubernetes API and holds no other
# credential.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-digest
  namespace: observability
  labels:
    app.kubernetes.io/name: cluster-digest
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  schedule: "*/15 * * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cluster-digest
            app.kubernetes.io/part-of: homelabs
            homelabs.dev/tier: platform
            homelabs.dev/managed-by: platform
        spec:
          serviceAccountName: cluster-digest
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # Same uid the data apps write the shares as, so the virtiofs
            # translation maps it to the host's `smores` owner of
            # /var/lib/data/cluster-digest.
            runAsUser: 1000
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest
              image: python:3.13.12-slim
              command: ["python", "-u", "/opt/digest/digest_builder.py"]
              env:
                - name: DIGEST_DIR
                  value: /mnt/data/cluster-digest
                - name: DIGEST_MAX_BYTES
                  value: "65536"
                - name: DIGEST_MAX_EVENTS
                  value: "400"
                - name: DIGEST_MAX_FILES
                  value: "96"
                - name: DIGEST_WINDOW
                  value: 15m
                - name: STATUS_EXPORTER_URL
                  value: http://status-exporter.observability.svc.cluster.local:9101/metrics
                - name: LOKI_GATEWAY_URL
                  value: http://loki-gateway.observability.svc.cluster.local:3100
                - name: LOKI_GATEWAY_TOKEN_FILE
                  value: /var/run/secrets/loki-gateway/token
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: TZ
                  value: UTC
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: source
                  mountPath: /opt/digest
                  readOnly: true
                - name: token
                  mountPath: /var/run/secrets/loki-gateway
                  readOnly: true
                - name: digest
                  mountPath: /mnt/data/cluster-digest
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: source
              configMap:
                name: cluster-digest-source
            - name: token
              secret:
                secretName: loki-gateway-token
                optional: false
                # The ESO Secret's key is `password`; project it as `token` so
                # the file name is the contract in docs/observability.md.
                items:
                  - key: password
                    path: token
            - name: digest
              persistentVolumeClaim:
                claimName: cluster-digest-data
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
