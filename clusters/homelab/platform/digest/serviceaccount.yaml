# No API token and no RBAC: the digest reads the status exporter and the Loki
# gateway over HTTP, so this identity exists only to keep the pod off the
# default account and to make "no binding" reviewable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-digest
  namespace: observability
  labels:
    app.kubernetes.io/name: cluster-digest
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
automountServiceAccountToken: false
