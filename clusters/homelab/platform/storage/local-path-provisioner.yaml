# The `local-path` provisioner ships from this repository because the cluster
# cannot be relied on to keep its own: the packaged k3s `local-storage` addon is
# disabled in nix-config and did not apply on the first bring-up, which left the
# non-data claims (github-backup-data, Prometheus, Loki) Pending with
# `storageclass.storage.k8s.io "local-path" not found`. Flux owns every addon
# that can be reinstalled declaratively, so this reviewed copy is the one the
# cluster reconciles. `data-local` (storageclass.yaml) remains the only class the
# data tier uses; admission policy `data-pvc-storage` enforces that.
#
# Upstream Rancher local-path-provisioner v0.0.31 (deploy/local-path-storage.yaml),
# adapted: the provisioner image is pinned to the multi-arch index digest,
# objects carry the platform labels, and the namespace carries a tier label so
# no admission policy can match it by accident. The helper pod, its setup and
# teardown scripts, and the `/opt/local-path-provisioner` node path are
# upstream's, unchanged.
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tenant: platform
    homelabs.dev/tier: platform
    homelabs.dev/managed-by: platform
    # `tier: platform` is what keeps every policy binding out: all of them
    # select tenant, broker or data. PSA stays at baseline because upstream's
    # provisioner and helper pods run as root; the helper pod creates the volume
    # directory on the node, and no hostPath is involved.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: local-path-storage
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: local-path-provisioner-role
  namespace: local-path-storage
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
# The helper pod that creates and removes the volume directory lives in this
# namespace, so its full lifecycle is a namespaced grant on purpose: the
# ClusterRole below only reads pods.
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-path-provisioner-bind
  namespace: local-path-storage
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      serviceAccountName: local-path-provisioner-service-account
      containers:
        - name: local-path-provisioner
          # Multi-arch index digest for v0.0.31, not just the tag: the tag is
          # mutable and this pod may create and delete directories on the node.
          image: rancher/local-path-provisioner:v0.0.31@sha256:80496fdeb307541007621959aa13aed41d31db9cd2dc4167c19833e0bfa3878c
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
# Deliberately not the default class, unlike the k3s addon's copy: a claim that
# omits `storageClassName` must fail instead of provisioning under
# /opt/local-path-provisioner, which is node disk outside the host's restic walk.
# Only the explicit observability and platform-backup claims use this class.
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: local-path-config
  namespace: local-path-storage
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
data:
  config.json: |-
    {
            "nodePathMap":[
            {
                    "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                    "paths":["/opt/local-path-provisioner"]
            }
            ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
      - name: helper-pod
        image: busybox
        imagePullPolicy: IfNotPresent
