# The repository mirror's read-only PAT. Never in a ConfigMap, never in git:
# `github-backup-read-pat-sops` is a SOPS+age Secret in the platform namespace
# (created by hand, docs/manual-steps.md step 22, because no age key exists in
# this repository), and this projection gives the CronJob the
# `github-backup-read-pat` name and `token` key its contract records.
#
# The operator's PAT is fine-grained (`github_pat_...`) with Contents: read on
# the two repositories only. A classic `repo`-scoped token is refused by the job
# at start, so a mistake here fails closed instead of mirroring with write
# access.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sops-contract
  namespace: platform
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  provider:
    kubernetes:
      remoteNamespace: platform
      server:
        url: https://kubernetes.default.svc
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-backup-read-pat
  namespace: platform
  labels:
    app.kubernetes.io/name: github-backup
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sops-contract
    kind: SecretStore
  target:
    name: github-backup-read-pat
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: github-backup-read-pat-sops
        property: token
