# The repository mirror's read-only PAT. Never in a ConfigMap, never in git:
# `github-backup-read-pat-sops` is a SOPS+age Secret in the platform namespace
# (created by hand, docs/manual-steps.md step 22, because no age key exists in
# this repository), and this projection gives the CronJob the
# `github-backup-read-pat` name and `token` key its contract records.
#
# The operator's PAT is fine-grained (`github_pat_...`) with Contents: read on
# the two repositories only. A classic `repo`-scoped token is refused by the job
# at start, so a mistake here fails closed instead of mirroring with write
# access.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sops-contract
  namespace: platform
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  provider:
    kubernetes:
      remoteNamespace: platform
      # The API server's certificate is signed by the cluster CA, which is not a
      # system root; kube-root-ca.crt is the per-namespace copy of it.
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: sops-contract
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-backup-read-pat
  namespace: platform
  labels:
    app.kubernetes.io/name: github-backup
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sops-contract
    kind: SecretStore
  target:
    name: github-backup-read-pat
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: github-backup-read-pat-sops
        property: token
---
# ESO cannot use its own ServiceAccount to read Secrets (v2 refuses it by design),
# so each store gets a namespace-local identity with read-only Secret access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sops-contract
  namespace: platform
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sops-contract-reader
  namespace: platform
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # The store reconciler validates its own permissions with this review.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sops-contract-reader
  namespace: platform
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
subjects:
  - kind: ServiceAccount
    name: sops-contract
    namespace: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sops-contract-reader
