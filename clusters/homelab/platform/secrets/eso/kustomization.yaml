apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# External Secrets objects. Applied by the suspended platform-secrets-eso
# Kustomization: the CRDs come from the External Secrets operator, which is not
# installed by this repository yet, so the stage is resumed by hand after the
# operator is present (docs/runbook.md). Keep it suspended until then so a
# missing CRD cannot wedge the tenant dependency chain.
resources:
  - secretstore.yaml
  - externalsecret.yaml
  - cloudflared-tunnel-token.yaml
  - graphiti-neuralwatt.yaml
  - immich-db.yaml
  - github-backup-read-pat.yaml
