# The bearer token the MCP wrapper validates. Same value as the host secrets'
# `memory-mcp-token`: maki, the shim and `cloudflared-memory` clients present it,
# and the wrapper compares it per request (503 when the Secret is empty).
#
# `memory-mcp-token-sops` is created by the operator (docs/manual-steps.md step
# 12), never in git. Rotation is: rewrite the SOPS Secret, let ESO re-read it,
# restart the Deployment, then roll the client copies in nix-config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-mcp-token
  namespace: graphiti
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sops-contract
    kind: SecretStore
  target:
    name: memory-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: memory-mcp-token-sops
        property: memory-mcp-token
