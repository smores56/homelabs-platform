# The Neuralwatt key Graphiti's extraction and embedding calls need. Never in a
# ConfigMap, never in git: `neuralwatt-api-key-sops` is the SOPS+age Secret
# (docs/manual-steps.md step 12), and this projection gives the Deployment the
# `neuralwatt-api-key` name the host's units use too. Rotation is: rewrite the
# SOPS Secret, let ESO re-read it (1h), restart the Deployment.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sops-contract
  namespace: graphiti
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  provider:
    kubernetes:
      remoteNamespace: graphiti
      # The API server's certificate is signed by the cluster CA, which is not a
      # system root; kube-root-ca.crt is the per-namespace copy of it.
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: sops-contract
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: neuralwatt-api-key
  namespace: graphiti
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sops-contract
    kind: SecretStore
  target:
    name: neuralwatt-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: neuralwatt-api-key-sops
        property: api-key
---
# ESO cannot use its own ServiceAccount to read Secrets (v2 refuses it by design),
# so each store gets a namespace-local identity with read-only Secret access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sops-contract
  namespace: graphiti
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sops-contract-reader
  namespace: graphiti
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # The store reconciler validates its own permissions with this review.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sops-contract-reader
  namespace: graphiti
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
subjects:
  - kind: ServiceAccount
    name: sops-contract
    namespace: graphiti
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sops-contract-reader
