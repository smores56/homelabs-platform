# The Neuralwatt key Graphiti's extraction and embedding calls need. Never in a
# ConfigMap, never in git: `neuralwatt-api-key-sops` is the SOPS+age Secret
# (docs/manual-steps.md step 12), and this projection gives the Deployment the
# `neuralwatt-api-key` name the host's units use too. Rotation is: rewrite the
# SOPS Secret, let ESO re-read it (1h), restart the Deployment.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sops-contract
  namespace: graphiti
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  provider:
    kubernetes:
      remoteNamespace: graphiti
      server:
        url: https://kubernetes.default.svc
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: neuralwatt-api-key
  namespace: graphiti
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sops-contract
    kind: SecretStore
  target:
    name: neuralwatt-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: neuralwatt-api-key-sops
        property: api-key
