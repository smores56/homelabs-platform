# The R2 key and repository password for the graphiti tree. Never in a
# ConfigMap, never in git: `restic-backup-sops` is the SOPS+age Secret in this
# namespace (docs/manual-steps.md step 24). The SecretStore, its ServiceAccount
# and its Role already exist for the memory token (`graphiti-neuralwatt.yaml`),
# so only the projection is here.
#
# refreshInterval 1h: a rotated key reaches the next run without a restart,
# because every job starts a fresh pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-credentials
  namespace: graphiti
  labels:
    app.kubernetes.io/name: restic
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sops-contract
    kind: SecretStore
  target:
    name: restic-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: restic-backup-sops
        property: r2-access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: restic-backup-sops
        property: r2-secret-access-key
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: restic-backup-sops
        property: restic-password
