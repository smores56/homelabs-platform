# Immich's Postgres password, minted once by ESO and never committed. The
# generator's name and the ExternalSecret's target are the same Secret the
# Postgres Deployment, the server and the dump CronJob read, so a rotation is
# "delete the Secret, ALTER USER, restart".
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: immich-db
  namespace: immich
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  length: 32
  digits: 8
  # Postgres URL-safe: no symbols that need quoting in a connection string.
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db
  namespace: immich
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  # 0 = mint once. A regenerated password would not match the live database.
  refreshInterval: "0"
  target:
    name: immich-db
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: immich-db
