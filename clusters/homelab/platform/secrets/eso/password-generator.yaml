# Generated secret, never committed and never shared between namespaces. The
# refreshInterval on the ExternalSecret below is 0, so the value is minted once
# and stays stable until the target Secret is deleted; rotating the broker token
# is "delete the Secret, let the generator run again".
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: nanobot-broker-token
  namespace: tenant-apps
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: tenant
spec:
  length: 48
  digits: 12
  symbolCharacters: "-_"
  noUpper: false
  allowRepeat: true
