# The R2 key and repository password for the immich tree. Never in a
# ConfigMap, never in git: `restic-backup-sops` is the SOPS+age Secret in this
# namespace (docs/manual-steps.md step 24), and this projection gives the two
# CronJobs the `restic-credentials` name and keys `restic-contract` records.
#
# refreshInterval 1h: a rotated key reaches the next run without a restart,
# because every job starts a fresh pod.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sops-contract
  namespace: immich
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  provider:
    kubernetes:
      remoteNamespace: immich
      # The API server's certificate is signed by the cluster CA, which is not a
      # system root; kube-root-ca.crt is the per-namespace copy of it.
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: sops-contract
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-credentials
  namespace: immich
  labels:
    app.kubernetes.io/name: restic
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sops-contract
    kind: SecretStore
  target:
    name: restic-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: restic-backup-sops
        property: r2-access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: restic-backup-sops
        property: r2-secret-access-key
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: restic-backup-sops
        property: restic-password
---
# ESO cannot use its own ServiceAccount to read Secrets (v2 refuses it by design),
# so each store gets a namespace-local identity with read-only Secret access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sops-contract
  namespace: immich
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sops-contract-reader
  namespace: immich
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # The store reconciler validates its own permissions with this review.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sops-contract-reader
  namespace: immich
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
subjects:
  - kind: ServiceAccount
    name: sops-contract
    namespace: immich
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sops-contract-reader
