# The cluster tunnel's token. Not a generated value: it is minted by Cloudflare
# when T7 creates the tunnel, so it is a SOPS contract. `cloudflare-tunnel-token-sops`
# is a SOPS+age Secret in the ingress namespace (created by hand,
# docs/manual-steps.md step 12, because no age key exists in this repository);
# this ExternalSecret projects it under the name the Deployment reads, the same
# two-step shape every contract secret uses.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sops-contract
  namespace: ingress
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: ingress
spec:
  provider:
    kubernetes:
      remoteNamespace: ingress
      # The API server's certificate is signed by the cluster CA, which is not a
      # system root; kube-root-ca.crt is the per-namespace copy of it.
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: sops-contract
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-token
  namespace: ingress
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: ingress
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sops-contract
    kind: SecretStore
  target:
    name: cloudflare-tunnel-token
    creationPolicy: Owner
  data:
    - secretKey: tunnel-token
      remoteRef:
        key: cloudflare-tunnel-token-sops
        property: tunnel-token
---
# ESO cannot use its own ServiceAccount to read Secrets (v2 refuses it by design),
# so each store gets a namespace-local identity with read-only Secret access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sops-contract
  namespace: ingress
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: ingress
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sops-contract-reader
  namespace: ingress
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: ingress
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # The store reconciler validates its own permissions with this review.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sops-contract-reader
  namespace: ingress
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: ingress
subjects:
  - kind: ServiceAccount
    name: sops-contract
    namespace: ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sops-contract-reader
