# The cluster tunnel's token. Not a generated value: it is minted by Cloudflare
# when T7 creates the tunnel, so it is a SOPS contract. `cloudflare-tunnel-token-sops`
# is a SOPS+age Secret in the ingress namespace (created by hand,
# docs/manual-steps.md step 12, because no age key exists in this repository);
# this ExternalSecret projects it under the name the Deployment reads, the same
# two-step shape every contract secret uses.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sops-contract
  namespace: ingress
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: ingress
spec:
  provider:
    kubernetes:
      remoteNamespace: ingress
      server:
        url: https://kubernetes.default.svc
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-token
  namespace: ingress
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: ingress
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sops-contract
    kind: SecretStore
  target:
    name: cloudflare-tunnel-token
    creationPolicy: Owner
  data:
    - secretKey: tunnel-token
      remoteRef:
        key: cloudflare-tunnel-token-sops
        property: tunnel-token
