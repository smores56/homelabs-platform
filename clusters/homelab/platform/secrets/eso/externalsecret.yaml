# One shape, credential-free in git:
# data.remoteRef pulls from the namespace-local SecretStore. Machine-generated
# passwords use a Password generator (observability/loki-gateway/eso); anything
# else is a SOPS+age file decrypted by kustomize-controller with the
# namespace-local sops-age key. The agent holds no broker token: the broker is
# reached over its NetworkPolicy-gated Service and authenticates the caller by
# that boundary alone (docs/broker.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: broker-placeholder
  namespace: tenant-apps
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: tenant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tenant-apps-store
    kind: SecretStore
  target:
    name: broker-placeholder
    creationPolicy: Owner
  data:
    - secretKey: placeholder
      remoteRef:
        key: placeholder
        property: placeholder
