# Two shapes, both credential-free in git:
#   - dataFrom.generatorRef mints a password (Password generator, no provider);
#   - data.remoteRef pulls from the namespace-local SecretStore.
# Anything the cluster must hold that is *not* machine-generated is a SOPS+age
# file decrypted by kustomize-controller with the namespace-local sops-age key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nanobot-broker-token
  namespace: tenant-apps
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: tenant
spec:
  refreshInterval: "0"
  target:
    name: nanobot-broker-token
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: nanobot-broker-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: broker-placeholder
  namespace: tenant-apps
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: tenant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tenant-apps-store
    kind: SecretStore
  target:
    name: broker-placeholder
    creationPolicy: Owner
  data:
    - secretKey: placeholder
      remoteRef:
        key: placeholder
        property: placeholder
