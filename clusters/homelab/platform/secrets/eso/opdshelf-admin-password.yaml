# OPDShelf's admin password. A SOPS contract like the tunnel token: the
# plaintext Secret `opdshelf-admin-password-sops` is created by hand from
# ~/secrets/homelabs-platform/opdshelf-admin-password.yaml
# (docs/manual-steps.md step 12 has the shape), and this ExternalSecret
# projects it under the name the Deployment reads.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sops-contract
  namespace: calibre
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  provider:
    kubernetes:
      remoteNamespace: calibre
      # The API server's certificate is signed by the cluster CA, which is not a
      # system root; kube-root-ca.crt is the per-namespace copy of it.
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: sops-contract
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opdshelf-admin
  namespace: calibre
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sops-contract
    kind: SecretStore
  target:
    name: opdshelf-admin
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: opdshelf-admin-password-sops
        property: password
---
# ESO cannot use its own ServiceAccount to read Secrets (v2 refuses it by design),
# so each store gets a namespace-local identity with read-only Secret access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sops-contract
  namespace: calibre
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sops-contract-reader
  namespace: calibre
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # The store reconciler validates its own permissions with this review.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sops-contract-reader
  namespace: calibre
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
subjects:
  - kind: ServiceAccount
    name: sops-contract
    namespace: calibre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sops-contract-reader
