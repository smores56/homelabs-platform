# Namespaced store: External Secrets in tenant-apps can read only from this
# store, and only this namespace's ExternalSecrets may reference it. The fake
# provider is a placeholder that stores no credential; the production path is
# SOPS+age for cluster secrets and the Password generator for machine secrets.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tenant-apps-store
  namespace: tenant-apps
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: tenant
spec:
  provider:
    fake:
      data:
        - key: "placeholder"
          value: "not-a-secret"
          version: "v1"
