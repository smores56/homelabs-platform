# SOPS + age contract, asserted at reconcile time rather than described only in
# a document. No key material lives here: the age identity is a Secret created
# by the operator (docs/manual-steps.md, step 6) and never committed.
#
# Rules this ConfigMap records:
#   - decryption happens in the namespace of the Kustomization that carries the
#     ciphertext, because the controller runs with --no-cross-namespace-refs;
#   - every namespace with encrypted manifests needs its own `sops-age` Secret
#     with key `age.agekey`;
#   - the controller-wide `--sops-age-secret` flag is not set, so a namespace
#     without the Secret fails loudly instead of silently decrypting with
#     another tenant's key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sops-contract
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
data:
  secretName: sops-age
  secretKey: age.agekey
  namespaces: broker,flux-system,tenant-apps
  kustomizationContract: |
    spec:
      decryption:
        provider: sops
        secretRef:
          name: sops-age
  controllerFlags: |
    --sops-age-secret is deliberately unset; per-namespace secretRef only.
  verify: |
    kubectl -n <namespace> get secret sops-age -o jsonpath='{.data.age\.agekey}' | base64 -d | head -1
