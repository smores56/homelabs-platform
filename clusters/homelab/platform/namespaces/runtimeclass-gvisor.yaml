# gVisor handler registered by the node's containerd config
# (io.containerd.runsc.v1 -> runsc). Pods in the tenant tier must name this
# class; tenant-gvisor.yaml rejects everything else.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    app.kubernetes.io/part-of: homelabs
handler: runsc
