apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The platform stack is a set of Flux Kustomizations, not one flat kustomize
# build: ordering is expressed with dependsOn so the stages apply in sequence on
# the cluster (namespaces -> rbac -> admission policy -> network -> secrets ->
# storage -> backup -> data apps -> ingress -> observability -> tenant
# reconciler). This directory therefore builds to Flux objects only; each stage
# directory builds on its own and is checked individually by
# scripts/kustomize-build-all.sh.
resources:
  - kustomizations/namespaces.yaml
  - kustomizations/rbac.yaml
  - kustomizations/policies.yaml
  - kustomizations/network.yaml
  - kustomizations/secrets.yaml
  - kustomizations/broker.yaml
  - kustomizations/storage.yaml
  - kustomizations/backup.yaml
  - kustomizations/data.yaml
  - kustomizations/ingress.yaml
  - kustomizations/observability.yaml
  - kustomizations/tenants.yaml
