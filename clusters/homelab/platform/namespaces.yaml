apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tenant: platform
    homelabs.dev/tier: platform
    # Flux, ESO and the policy controllers need baseline; everything else is
    # restricted. Audit and warn still surface restricted violations.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
