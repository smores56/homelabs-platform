# The backup job's identity. It never talks to the API server and never mounts a
# token; the PAT is a file in the pod, not a Kubernetes credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-backup
  namespace: platform
  labels:
    app.kubernetes.io/name: github-backup
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
automountServiceAccountToken: false
