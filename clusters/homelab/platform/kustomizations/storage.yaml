# Stage 5b. The storage contract every data app binds to: the `data-local`
# StorageClass and one static PV per virtiofs share. Storage is cluster-scoped
# and the PVCs are namespaced, so this stage only needs the namespaces to exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-storage
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./clusters/homelab/platform/storage
  dependsOn:
    - name: platform-namespaces
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
