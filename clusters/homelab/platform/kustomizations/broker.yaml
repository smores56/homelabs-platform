# Stage 5a. The broker depends on the namespace, its identity, the admission
# policy that forces gVisor, the network default-deny and the SOPS contract it
# reads credentials through. Tenant workloads come later, so no agent pod starts
# before its only egress path exists.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-broker
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./clusters/homelab/broker
  dependsOn:
    - name: platform-namespaces
    - name: platform-rbac
    - name: platform-policies
    - name: platform-network
    - name: platform-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
