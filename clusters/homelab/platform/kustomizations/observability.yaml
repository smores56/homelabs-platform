# Stage 5b. Prometheus, Loki, Vector, the status exporter and the Loki gateway.
# After policies so every workload here is already covered by the namespace
# guards; before tenants, because a tenant Kustomization must never be the thing
# that brings up the log pipeline it is audited through.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-observability
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  path: ./clusters/homelab/observability
  dependsOn:
    - name: platform-policies
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
---
# External Secrets objects for the observability namespace: the Loki gateway
# token (a Password generator) and the mail relay's Cloudflare token, which is a
# SOPS projection. Same precondition as platform-secrets-eso: install the
# operator first (docs/manual-steps.md step 8).
# Do not express that as `suspend: true` here — git owns this spec, so the flag
# would return on the next flux-system reconcile.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-observability-secrets
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./clusters/homelab/observability/eso
  dependsOn:
    - name: platform-observability
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
