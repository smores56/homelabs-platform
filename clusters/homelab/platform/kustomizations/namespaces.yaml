# Stage 1 of the platform stack. Every later stage selects on the labels this
# one creates, so it is the root of the dependsOn chain.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-namespaces
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./clusters/homelab/platform/namespaces
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The bootstrap identity holds cluster-admin; namespaces and RuntimeClasses
  # are cluster-scoped, so the controller-wide --default-service-account=default
  # cannot apply this stage. Stated per object, never globally.
  serviceAccountName: kustomize-controller
