# Stage 5b. The capability the agent gets instead of an API route: one service,
# one identity, nine routes. It depends on the identity (module 5a's stage
# chain), the admission policies that force gVisor and the digest pin, and the
# network default-deny plus the broker pair, so no agent pod can reach it before
# its egress path exists.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-agent-control
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./clusters/homelab/agent-control
  dependsOn:
    - name: platform-namespaces
    - name: platform-rbac
    - name: platform-policies
    - name: platform-network
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
