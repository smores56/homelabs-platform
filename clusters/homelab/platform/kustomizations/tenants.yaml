# Stage 6, last: the tenant reconciler object only appears once namespaces,
# identity, admission policy, network isolation and the secret contract are all
# in place, so it can never reconcile into an unguarded namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-tenants
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./clusters/homelab/platform/tenants
  dependsOn:
    - name: platform-policies
    - name: platform-network
    - name: platform-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
