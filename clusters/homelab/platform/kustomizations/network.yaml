# Stage 4. Network isolation, ordered beside policies; both need only the
# namespace labels.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-network
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./clusters/homelab/platform/network
  dependsOn:
    - name: platform-namespaces
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
