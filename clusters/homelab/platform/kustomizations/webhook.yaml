# Stage 5b. The inbound webhook receiver depends on the namespace, the policy
# that pins gVisor/non-root/read-only at admission, the network default-deny
# (its own ingress and egress are part of its directory, the two remote halves
# are in the network stage) and the token contract it mounts. It has no RBAC of
# its own: it never calls the API server.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-webhook
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./clusters/homelab/webhook
  dependsOn:
    - name: platform-namespaces
    - name: platform-network
    - name: platform-policies
    - name: platform-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
