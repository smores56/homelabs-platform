# Stage 5c. The repository mirror. It needs the namespace labels and the
# admission policy in place; the PAT Secret arrives out of band (SOPS + ESO), and
# the job stays unstarted until it exists.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-backup
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./clusters/homelab/platform/backup
  dependsOn:
    - name: platform-namespaces
    - name: platform-policies
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
