# Stage 5. Secret contract. Any encrypted manifest added to this path needs a
# spec.decryption block with the flux-system sops-age Secret; the controller-wide
# --sops-age-secret flag stays unset on purpose.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-secrets
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./clusters/homelab/platform/secrets
  dependsOn:
    - name: platform-namespaces
    - name: platform-policies
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
---
# External Secrets objects. Suspended: the operator (and therefore its CRDs) is
# not installed by this repository, and a stage that cannot apply would block
# every dependent. Resume by hand once the operator is present.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-secrets-eso
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  suspend: true
  path: ./clusters/homelab/platform/secrets/eso
  dependsOn:
    - name: platform-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
