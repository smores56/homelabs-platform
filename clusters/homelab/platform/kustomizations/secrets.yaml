# Stage 5. Secret contract. Any encrypted manifest added to this path needs a
# spec.decryption block with the flux-system sops-age Secret; the controller-wide
# --sops-age-secret flag stays unset on purpose.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-secrets
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./clusters/homelab/platform/secrets
  dependsOn:
    - name: platform-namespaces
    - name: platform-policies
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
---
# External Secrets objects. The operator is installed by hand
# (docs/manual-steps.md step 8) because its CRDs are not part of this repository,
# so that installation is a precondition, not something to gate the stage on:
# `suspend: true` here is not durable, because this object's spec is reconciled
# from git and every flux-system reconcile re-applies the suspension, silently
# undoing a `flux resume`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-secrets-eso
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./clusters/homelab/platform/secrets/eso
  dependsOn:
    - name: platform-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
