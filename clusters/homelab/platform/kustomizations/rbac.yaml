# Stage 2. Identities exist before the admission policies that name them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-rbac
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./clusters/homelab/platform/rbac
  dependsOn:
    - name: platform-namespaces
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
