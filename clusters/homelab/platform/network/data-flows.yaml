# Data namespaces are default-deny in both directions. Two flows are opened:
#
#   1. same-namespace traffic, because Immich talks to its own Postgres and
#      Redis inside the `data` namespace;
#   2. Immich HTTP 2283 from the `ingress` namespace only, which is the single
#      path a cloudflared/ingress proxy may use into a data app.
#
# Adding an app means adding a policy with its exact port; nothing here matches
# all namespaces or all ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: data
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-http-from-ingress
  namespace: data
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immich
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - protocol: TCP
          port: 2283
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-data-immich-only
  namespace: ingress
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: ingress
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: immich
      ports:
        - protocol: TCP
          port: 2283
