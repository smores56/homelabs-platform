# Data namespaces are default-deny in both directions. The flows opened here are
# the complete set, one per app:
#
#   1. same-namespace traffic, because Immich talks to its own Postgres and
#      Valkey and Graphiti to its own FalkorDB;
#   2. the app's HTTP port from the `ingress` namespace only, which is the one
#      path cloudflared may use into a data app;
#   3. HTTPS to the public internet for the two pods that fetch remote content
#      (`immich-machine-learning` downloads model weights, Graphiti calls the
#      Neuralwatt API). Port 443 is the only port the cluster guest can open
#      anyway: modules/nixos/cluster-vm.nix on the host forwards 80/443, DNS and
#      NTP from the tap and drops everything else.
#
# Adding an app means adding a policy with its exact port; nothing here matches
# all namespaces or all ports.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: immich
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-http-from-ingress
  namespace: immich
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immich
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - protocol: TCP
          port: 2283
---
