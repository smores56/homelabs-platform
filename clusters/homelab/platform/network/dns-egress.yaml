# Cluster DNS is the only egress every namespace gets. It is scoped to the
# kube-system namespace label rather than a CIDR, so a renumbered cluster or a
# second resolver inside kube-system keeps working without widening egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: tenant-apps
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: tenant
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
