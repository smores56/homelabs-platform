# Default deny in both directions for every namespace that holds untrusted or
# data-bearing workloads. Each allow below is explicit and lives in its own
# file; a missing allow fails closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: tenant-apps
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: tenant
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
