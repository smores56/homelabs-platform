# The cluster tunnel is the only ingress path for the agent. Cloudflare Access
# authenticates the owner and maki's service token; this rule admits the
# connector to the tenant pod on the one port it serves. The tenant side of the
# pair (ingress from `ingress` to `nanobot`) is in homelabs-apps, because the
# tenant's default-deny lives there; both are needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-agent
  namespace: ingress
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tenant-apps
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nanobot
      ports:
        - protocol: TCP
          port: 8080
