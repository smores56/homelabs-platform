apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Image automation objects live beside the controllers because they are part of
# the same installation: `flux bootstrap` regenerates gotk-components.yaml and
# gotk-sync.yaml, but never this directory. The root Kustomization applies it, so
# the CRDs and these objects land in the same reconcile (CRDs first).
#
# The Git write credential is not in git: `homelabs-apps-write` is a SOPS-encrypted
# Secret created by the operator (docs/manual-steps.md, nanobot image automation
# step). Until it exists the GitRepository stays NotReady and nothing is pushed —
# fail closed, like every other credential in this repository.
resources:
  - homelabs-apps-git.yaml
  - nanobot-image.yaml
  - nanobot-update.yaml
  - write-contract.yaml
