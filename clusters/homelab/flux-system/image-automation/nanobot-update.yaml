# Flux commits the digest into smores56/homelabs-apps. The marker it looks for is
# in that repository (tenant side, added by another lane):
#
#   image: ghcr.io/smores56/homelabs-platform/nanobot@sha256:<old>
#     # {"$imagepolicy": "flux-system:nanobot:digest"}
#
# The push uses the same write deploy key as `homelabs-apps-git.yaml`, so the
# commit is attributable to the automation identity and the tenant's own
# reconciler reads it back from main with no token.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: nanobot
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: homelabs
    homelabs.dev/tier: platform
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: homelabs-apps
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: flux-image-automation
        email: flux-image-automation@users.noreply.github.com
      # Conventional Commits, like every other change in the tenant repository.
      messageTemplate: |
        feat(nanobot): roll the image to the latest build

        {{ .Changed.Summary }}
    push:
      branch: main
  update:
    strategy: Setters
    # The marker lives in apps/nanobot/deployment.yaml; scan from the root so a
    # moved directory does not silently stop the automation.
    path: ./
