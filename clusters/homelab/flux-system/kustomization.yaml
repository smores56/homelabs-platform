apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Two generated files plus two tracked directories. gotk-components.yaml is
# regenerated by `flux install --export` and gotk-sync.yaml by `flux bootstrap`
# (then re-rendered from bootstrap.sh so the root Kustomization stays pinned to
# the cluster-admin service account). image-automation/ and alerts/ are ours:
# bootstrap never writes them, so the ImageRepository/ImagePolicy/
# ImageUpdateAutomation objects and the Provider/Alert survive a re-bootstrap.
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - image-automation
  - alerts
