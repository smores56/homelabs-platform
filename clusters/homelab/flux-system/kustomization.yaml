apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Two generated files plus one tracked directory. gotk-components.yaml is
# regenerated by `flux install --export` and gotk-sync.yaml by `flux bootstrap`
# (then re-rendered from bootstrap.sh so the root Kustomization stays pinned to
# the cluster-admin service account). image-automation/ is ours: bootstrap never
# writes it, so the ImageRepository/ImagePolicy/ImageUpdateAutomation objects
# survive a re-bootstrap.
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - image-automation
