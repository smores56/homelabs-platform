apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Exactly what `flux bootstrap` keeps in this directory. Both files are
# regenerated by bootstrap: gotk-components.yaml by `flux install --export`,
# gotk-sync.yaml by `flux bootstrap` (then re-rendered from bootstrap.sh so the
# root Kustomization stays pinned to the cluster-admin service account).
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
